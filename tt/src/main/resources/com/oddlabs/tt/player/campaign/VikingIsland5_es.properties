header=Gutshumdi
description=Tu primo, Gunnar el Gazn\u00E1piro, est\u00E1 intentando conquistar esta isla, pero podr\u00EDa venirle bien alguna ayuda para aplastar los asentamientos ind\u00EDgenas. Si le ayudas, Gunnar podr\u00EDa prestarte algunos de sus hombres.
header0=Jefe Fjorleif
dialog0=De acuerdo, \u00A1vamos a destrozar esas chozas! Pero tened cuidado y no hag\u00E1is da\u00F1o a nuestros amigos.
header1=Jefe Gunnar
dialog1=No puedo creerlo, \u00A1los nativos nos arrojan lanzas! Si nos ayudas a aniquilarlos, te recompensar\u00E9.
header2=Jefe Gunnar
dialog2=\u00A1Gracias por tu ayuda! Te prestar\u00E9 5 de mis mejores guerreros para que te ayuden en tu misi\u00F3n.
game_over=La tribu de Gunnar fue eliminada. Fin de la partida.
