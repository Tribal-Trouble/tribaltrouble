header=Dyngjaskagi
description=Gunnar a parl\u00E9 d\u2019un grand et redoutable dieu du tonnerre qui tra\u00EEne sur cette \u00EEle. Bon, il n\u2019est s\u00FBrement m\u00EAme pas \u00E0 moiti\u00E9 aussi puissant que le Tout-Puissant Xarrr, mais il pourrait quand m\u00EAme aider avec le Nuage cr\u00E9pitant d\u00E9faillant.
header0=Chef Ngumba
dialog0=Voil\u00E0 notre destination \u2013 un petit pique-nique en perspective. D\u00E9p\u00EAchons-nous, je crois que les Vikings arrivent aussi. Oh, et ne vous approchez pas trop de ces tours.
header1=Thor
dialog1=Qui ose p\u00E9n\u00E9trer sur ma p\u00E9ninsule ?!?
header2=Chef Ngumba
dialog2=Le chef Ngumba et ses guerriers intr\u00E9pides !
header3=Thor
dialog3=Impertinent petit vermisseau ! Tu vas le regretter !
header4=Chef Ngumba
dialog4=Aiieuuuh, Grand Xarrr, prot\u00E8ge-nous !
header5=Thor
dialog5=Xarrr ? Tu le connais ? C\u2019est un de mes vieux amis de l\u2019Acad\u00E9mie des Dieux. Sacr\u00E9 type !
header6=Chef Ngumba
dialog6=Euh, oui. Il m\u2019a appris \u00E0 contr\u00F4ler le climat pour foudroyer mes ennemis avec des \u00E9clairs furieux. Mais bizarrement, \u00E7a ne marche pas dans ce climat froid\u2026
header7=Thor
dialog7=Alors il a d\u00FB aussi t\u2019apprendre \u00E0 pr\u00E9parer ce d\u00E9licieux Rago\u00FBt Puant qu\u2019il cuisait autrefois. J\u2019adore la cuisine exotique, mais ma femme sert toujours ce porc hach\u00E9 ennuyeux et du boudin noir. Cuisine-moi ce rago\u00FBt et je t\u2019aiderai avec ton probl\u00E8me d\u2019\u00E9clairs !
header8=Chef Ngumba
dialog8=Pas de probl\u00E8me Thor, je vais te pr\u00E9parer du Rago\u00FBt Puant !
name2=Guardes
name4=Vikings
god=Thor
objective0=Rendez-vous aupr\u00E8s de Thor.
objective1=Pr\u00E9parez du Rago\u00FBt Puant pour Thor.
