header=J\u00F6kullhnj\u00FAkur
description=A temida ilha-pris\u00E3o dos Vikings, onde eles prendem seus prisioneiros mais problem\u00E1ticos.
header0=Fufubi Franzino
dialog0=Sauda\u00E7\u00F5es chefe, n\u00F3s sab\u00EDamos que voc\u00EA viria ao resgate! N\u00F3s conseguimos escapar do acampamento de pris\u00E3o mas estiv\u00E9mos nos escondendo aqui por dias sem \u00E1gua ou comida... Receio estarmos em uma condi\u00E7\u00E3o bem ruim, ent\u00E3o n\u00E3o podemos ajudar a lutar contra os Vikings.
header1=Chefe Ngumba
dialog1=N\u00E3o se preocupe, n\u00F3s vamos proteger voc\u00EAs, mas n\u00F3s temos um pequeno problema: Nosso navio bateu em um recife e est\u00E1 afundando aos poucos, ent\u00E3o precisamos reparar-lo. Se n\u00F3s conseguirmos segurar nosso territ\u00F3rio por um tempo, n\u00F3s conseguiremos sair dessa ilha e levar voc\u00EAs com a gente.
game_over=Todos os prisioneiros foram mortos. Fim de jogo.
