dialog1=Bitte helft uns! Wir konnten uns Egill Eierkopfs Pl\u00FCndergeb\u00FChr nicht leisten, und so hat er unser Schiff konfisziert und uns hier zur\u00FCckgelassen. Jetzt haben uns die Eingeborenen entdeckt, und sie scheinen nicht besonders erfreut dar\u00FCber zu sein, dass wir sie mit unserem Besuch beehren.
