header=Reykur\u00F6r\u00E6fi
description=Esse tem que ser o esconderijo secreto de Fjorleif. Sem d\u00FAvida alguma ele escondeu as est\u00E1tuas aqui.
header0=Chefe Fjorleif
dialog0=Hora hora... olhe quem n\u00F3s temos aqui. Se n\u00E3o \u00E9 o famoso Chefe Ngumba! Voc\u00EA deve realmente se importar com essas est\u00E1tuas feias j\u00E1 que voc\u00EA veio at\u00E9 aqui por elas.
header1=Chefe Ngumba
dialog1=Mais do que voc\u00EA pensa, Fjorleif... Eu acho que \u00E9 hora de ensinarmos a voc\u00EA uma li\u00E7\u00E3o sobre n\u00E3o roubar as est\u00E1tuas douradas de outras pessoas!
name2=Vikings
