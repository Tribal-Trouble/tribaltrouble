header=Kogafutshlum
description=Ukryta wyspa, na kt\u00F3rej szczycie g\u00F3ry zamieszkuje wielki b\u00F3g piorun\u00F3w Xarrr. Je\u015Bli dotrzemy na sam szczyt, mo\u017Ce spe\u0142ni nasze \u017Cyczenie.
header0=W\u00F3dz Fjorleif
dialog0=To musi by\u0107 g\u00F3ra, o kt\u00F3rej wspomina\u0142 w\u00F3dz Mozumba. Musimy dotrze\u0107 na jej szczyt, ale nie jestem pewien, czy ci tubylcy przepuszcz\u0105 nas bez walki. Mo\u017Ce zdo\u0142amy znale\u017A\u0107 inn\u0105 drog\u0119 dooko\u0142a?
header1=W\u00F3dz Fjorleif
dialog1=W ko\u0144cu dotarli\u015Bmy na szczyt! Gdzie jest ten b\u00F3g piorun\u00F3w... jedyne, co tu widz\u0119, to ma\u0142y, brzydki pos\u0105g!
header2=Xarrr, Gromow\u0142adny
dialog2=CO SPROWADZA CI\u0118 DO MOJEJ SIEDZIBY, \u015AMIERTELNIKU?   
header3=W\u00F3dz Fjorleif
dialog3=A niech to, ten pos\u0105g m\u00F3wi! Yyy... o, Wielki Xarrr, w\u00F3dz Mozumba powiedzia\u0142 mi, \u017Ce je\u015Bli wejdziemy na twoj\u0105 g\u00F3r\u0119, by\u0107 mo\u017Ce b\u0119dziesz tak \u0142askawy i spe\u0142nisz nasze... yyy...
header4=Xarrr, Gromow\u0142adny
dialog4=\u017BYCZENIE?
header5=W\u00F3dz Fjorleif
dialog5=*prze\u0142yka \u015Blin\u0119* Tak, dok\u0142adnie to!
header6=Xarrr, Gromow\u0142adny
dialog6=No dobrze, czego sobie \u017Cyczysz, \u015Bmiertelniku?
header7=W\u00F3dz Fjorleif
dialog7=Hm\u2026 Chcia\u0142bym, aby moi wrogowie upadli przede mn\u0105!
header8=Xarrr, Gromow\u0142adny
dialog8=Dobrze wi\u0119c, od teraz b\u0119dziesz m\u00F3g\u0142 u\u017Cywa\u0107 swojego luru, aby wyda\u0107 Niszczycielski Ryk, kt\u00F3ry zmia\u017Cd\u017Cy wszystko w pobli\u017Cu!
header9=W\u00F3dz Fjorleif
dialog9=O, dzi\u0119ki... chyba?
header10=Xarrr, Gromow\u0142adny
dialog10=A teraz, je\u015Bli pozwolicie... Mam burz\u0119 do poprowadzenia.
header11=W\u00F3dz Fjorleif
dialog11=Hmm... to by t\u0142umaczy\u0142o t\u0119 szalej\u0105c\u0105 burz\u0119, przez kt\u00F3r\u0105 w og\u00F3le tu trafili\u015Bmy. No c\u00F3\u017C, lepiej wypr\u00F3bujmy ten nowy Niszczycielski Ryk, zanim ruszymy dalej. Zr\u00F3bmy tylko ma\u0142\u0105 demonstracj\u0119.
