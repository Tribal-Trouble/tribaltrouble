header=Lumumgumphe
description=El barco no puede cruzar el arrecife con el Jefe Fjorleif y sus, digamos pesados, tripulantes a bordo. En vez de ello, tendr\u00E1n que atravesar la isla a pie mientras que el primero de abordo navega solo a trav\u00E9s del arrecife.
header0=Jefe  Fjorleif
dialog0=\u00A1Tened cuidado, chicos! Esta isla est\u00E1 plagada de ind\u00EDgenas hostiles, as\u00ED que tendr\u00E9is que vigilar donde pis\u00E1is. Necesitamos llegar hasta ese punto de encuentro en el otro lado de la isla.
header1=Alcanzado punto de encuentro
dialog1=Has llegado al punto de encuentro. Haz una se\u00F1al a tu barco para que vaya a recogeros, un Lur Liante servir\u00E1.
header2=Rteingrim Revientacalaveras
dialog2=\u00A1A los buenos d\u00EDas! Nuestra nave encall\u00F3 en los arrecifes, as\u00ED que hemos estado acampados aqu\u00ED durante un tiempo. Nos hemos ocultado de los ind\u00EDgenas qued\u00E1ndonos en este valle, \u00A1as\u00ED que sois bienvenidos! Estaremos encantados de unirnos a vosotros... puede ser nuestra \u00FAnica manera de salir de aqu\u00ED.
name1=Acampados
name2=Ind\u00EDgenas
objective0=Alcanzar el punto de encuentro.
objective1=Hacer un Lur Liante cerca del punto de encuentro.
