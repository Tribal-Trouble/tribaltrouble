header=Var\u00F0ask\u00F3gur
description=By\u0107 mo\u017Ce to jest owa tajemnicza wyspa, o kt\u00F3rej m\u00F3wi\u0142 Grimhildur Guzzlegut, gdy twierdzi\u0142, \u017Ce Fjorleif pop\u0142yn\u0105\u0142 na zach\u00F3d z pos\u0105gami.
header0=W\u00F3dz Ngumba
dialog0=Na \u015Bmier\u0107 i rozwolnienie, tutaj te\u017C nie ma \u017Cadnych pos\u0105g\u00F3w! Przynajmniej wygl\u0105da na to, \u017Ce kilku naszych ludzi rozbi\u0142o ob\u00F3z kawa\u0142ek dalej wzd\u0142u\u017C wybrze\u017Ca.
header1=W\u00F3dz Gotoba
dialog1=B\u0105d\u017A pozdrowiony, wodzu Ngumba! Jeste\u015Bmy grup\u0105 by\u0142ych niewolnik\u00F3w, kt\u00F3rym uda\u0142o si\u0119 uciec. Dzi\u0119ki ogromowi tej wyspy uda\u0142o nam si\u0119 ukry\u0107 przed Wikingami. Rozbijamy tu ob\u00F3z, \u017Ceby zbudowa\u0107 statek i pop\u0142yn\u0105\u0107 do domu.
header2=W\u00F3dz Ngumba
dialog2=A mo\u017Ce po\u0142\u0105czymy si\u0142y i przep\u0119dzimy Wiking\u00F3w z tej wyspy? Bez Wiking\u00F3w, kt\u00F3rzy by nam przeszkadzali, budowa \u0142odzi na pewno sz\u0142aby znacznie \u0142atwiej.
header3=W\u00F3dz Gotoba
dialog3=Brzmi jak plan... czas na ma\u0142e lanie Wiking\u00F3w!
header4=Ngolongo Zwinna Stopa
dialog4=Hej, wodu, znale\u017Ali\u015Bmy ciekaw\u0105 map\u0119 w ruinach. Pokazuje wysp\u0119, o kt\u00F3rej nie wiedzieli\u015Bmy, wi\u0119c dorysowa\u0142em j\u0105 teraz do naszej mapy. Mo\u017Ce to w\u0142a\u015Bnie tam ukrywa si\u0119 Fjorleif?
game_over=Wszyscy sojusznicy zgin\u0119li. Koniec gry.
name1=Sojusznicy
name2=Wikingowie
name3=Wikingowie
objective=Zniszcz Wiking\u00F3w.\nChro\u0144 swoich sojusznik\u00F3w.
