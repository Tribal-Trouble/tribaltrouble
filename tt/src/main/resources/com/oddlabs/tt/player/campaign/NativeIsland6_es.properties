header=Var\u00F0ask\u00F3gur
description=Quiz\u00E1s esta es la isla secreta de la que hablaba Trimhildur Tragaca\u00F1as, cuando nos dijo que Fjorleif parti\u00F3 hacia el oeste con las estatuas.
header0=Jefe Ngumba
dialog0=\u00A1Muerte y Diarrea, aqu\u00ED tampoco hay estatuas!... Al menos parece que algunos de nuestros paisanos han montado un campamento un poco m\u00E1s arriba en la costa.
header1=Jefe Gotoba
dialog1=\u00A1A los buenos d\u00EDas, Jefe Ngumba! Somos un grupo de los rehenes que consiguieron escapar. Gracias al imponente tama\u00F1o de esta isla hemos conseguido escondernos de los Vikingos. Hemos montado este campamento aqu\u00ED, as\u00ED podremos construir un barco y volver a casa.
header2=Jefe Ngumba
dialog2=\u00BFQu\u00E9 tal si nos agrupamos y echamos a los vikingos de esta isla? Sin vikingos que interfieran, estoy seguro que construir un barco ser\u00E1 mucho m\u00E1s f\u00E1cil.
header3=Jefe Gotoba
dialog3=Eso suena como un plan... \u00A1Hora de apalear Vikingos!
header4=Pognongo Piesbailongos
dialog4=Eh Jefe, hemos encontrado un mapa muy interesante en las ruinas. Muestra una isla de la que no sab\u00EDamos nada, as\u00ED que la he a\u00F1adido a nuestro mapa. \u00BFQuiz\u00E1s sea all\u00ED donde se esconde Fjorleif?
game_over=Todos los aliados fueron asesinados. Fin de la partida.
name1=Aliados
name2=Vikingos
name3=Vikingos
objective=Destruye a los Vikingos.\nProtege a tus aliados.
