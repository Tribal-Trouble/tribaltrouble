header=Reykur\u00F6r\u00E6fi
description=Det her m\u00E5 bare v\u00E6re Fjorleifs hemmelige gemmested. Ingen tvivl om at statuerne er gemt her.
header0=H\u00F8vding Fjorleif
dialog0=Jamen dog... se hvem vi har her. Er det ikke den berygtede H\u00F8vding Ngumba! Du m\u00E5 virkelig v\u00E6re glad for de grimme statuer, siden du gider rejse helt herop efter dem.
header1=H\u00F8vding Ngumba
dialog1=Mere end du tror, Fjorleif... Jeg tror det er p\u00E5 tide, at vi giver dig en l\u00E6restreg om ikke at stj\u00E6le andre folks guldstatuer!
name2=Vikinger
statue=Guldstatue
objective=Udslet Fjorleifs stamme og stj\u00E6l statuerne tilbage.
