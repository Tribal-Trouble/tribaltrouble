header=Fufupogo
description=Una de las naves de nuestros rivales ha sido vista cerca de esta isla. Quiz\u00E1s tambi\u00E9n han averiguado algo sobre el tesoro de los ind\u00EDgenas.
header0=Jefe Fjorleif
dialog0=\u00A1Oh no, mi archienemigo Cagill Cabezahuevo ha conquistado esta isla! Sin duda \u00E9l tambi\u00E9n est\u00E1 tras el tesoro de los ind\u00EDgenas. \u00A1Wops, creo que nos han visto!
header1=Cagill Cabezahuevo
dialog1=\u00A1Fjorleif Fuerapedo, nos volvemos a encontrar!
header2=Jefe Fjorleif
dialog2=Grrrr... \u00A1No me llames por mi nombre completo delante de mis hombres!
header3=Cagill Cabezahuevo
dialog3=Bueno, estoy aqu\u00ED para informarte que este grupo de islas es ahora propiedad de la Compa\u00F1\u00EDa de Saqueos Cabezahuevo, y que tu presencia aqu\u00ED requiere que pagues la tasa de la licencia de saqueos de un barril de oro al d\u00EDa. \u00BFEst\u00E1s de acuerdo con las condiciones?
header4=Jefe Fjorleif
dialog4=\u00BFQu\u00E9? \u00A1Si nosotros llegamos primero!
header5=Cagill Cabezahuevo
dialog5=Obviamente no. Y tomar\u00E9 eso como un no. Mis guerreros ver\u00E1n como eres expulsado de esta isla con violentas y en general desagradables maneras. \u00A1Que tengas un buen d\u00EDa!
header6=Jefe Fjorleif
dialog6=Ese bastardo...\u00A1no se va a ir tan alegremente!
header7=Petur el Pe\u00F3n
dialog7=\u00BFFuerapedo, eh?
header8=Jefe Fjorleif
dialog8=...\u00A1C\u00E1lla y lucha!
name2=Cabezahuevos
objective=Destruye a los Cabezahuevos.
