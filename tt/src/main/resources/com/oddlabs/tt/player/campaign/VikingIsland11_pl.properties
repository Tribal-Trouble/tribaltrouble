header=Fufupogo
description=W pobli\u017Cu tej wyspy zauwa\u017Cono jeden ze statk\u00F3w naszych wrog\u00F3w. By\u0107 mo\u017Ce oni r\u00F3wnie\u017C dowiedzieli si\u0119 o skarbie tubylc\u00F3w.
header0=W\u00F3dz Fjorleif
dialog0=O nie, m\u00F3j najwi\u0119kszy wr\u00F3g Egill Jajog\u0142owy podbi\u0142 t\u0119 wysp\u0119! Bez w\u0105tpienia on te\u017C poluje na skarb tubylc\u00F3w. A niech to, chyba nas zauwa\u017Cy\u0142!
header1=Egill Jajog\u0142owy
dialog1=Fjorleif Pierdzioch, zn\u00F3w si\u0119 spotykamy!
header2=W\u00F3dz Fjorleif
dialog2=*Mruczenie* \u2026 Nie nazywaj mnie pe\u0142nym imieniem, kiedy wszyscy s\u0142uchaj\u0105!
header3=Egill Jajog\u0142owy
dialog3=C\u00F3\u017C, przyszed\u0142em, aby poinformowa\u0107 ci\u0119, \u017Ce ta cz\u0119\u015B\u0107 wysp jest teraz w\u0142asno\u015Bci\u0105 przedsi\u0119biorstwa "Egghead Looting" i \u017Ce wasza obecno\u015B\u0107 wi\u0105\u017Ce si\u0119 z obowi\u0105zkiem uiszczania op\u0142aty za pozwolenie na pl\u0105drowanie w wysoko\u015Bci jednej beczki z\u0142ota dziennie. Czy zgadzasz si\u0119 na te warunki?
header4=W\u00F3dz Fjorleif
dialog4=Co?!? Ale to my przybyli\u015Bmy tu pierwsi!
header5=Egill Jajog\u0142owy
dialog5=Oczywi\u015Bcie, \u017Ce nie. Uznam to zatem za odpowied\u017A odmown\u0105. Moi wojownicy dopilnuj\u0105, aby wyrzucono was z tej wyspy w spos\u00F3b brutalny i og\u00F3lnie rzecz bior\u0105c nieprzyjemny. \u017Begnam!
header6=W\u00F3dz Fjorleif
dialog6=Ten dra\u0144... nie ujdzie mu to na sucho!
header7=Petur Robotnik
dialog7=Pierdzioch... Co?
header8=W\u00F3dz Fjorleif
dialog8=Oh... Po prostu zamknij si\u0119 i walcz!   
name2=Jajog\u0142owi
objective=Zniszcz Jajog\u0142owych.
