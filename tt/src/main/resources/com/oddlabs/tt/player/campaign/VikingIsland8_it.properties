header=Lumumgumphe
description=La nave non pu\u00F2 attraversare lo stretto con il Capo Fjorleif a bordo per via della sua stazza. Dovremo invece attraversare l''isola a piedi mentre il timoniere porter\u00E0 la nave attraverso lo stretto.
header0=Capo Fjorleif
dialog0=Fate attenzione, uomini! Quest''isola \u00E8 piena di nativi ostili, teniamo gli occhi aperti. Dobbiamo raggiungere il punto di incontro dall''altra parte dell''isola.
header1=Raggiunto il punto di incontro
dialog1=Hai raggiunto il punto di incontro. Segnala alla tua nave di venirti a prendere suonando il Boato Terrificante.
header2=Steingrim Spaccateste
dialog2=Fulmini e saette! La nostra nave si \u00E8 incagliata nello stretto, cos\u00EC siamo rimasti bloccati qui per un po''! Ci siamo nascosti dai nativi rimanendo in questa valle e siamo pi\u00F9 che felici di vedervi! Ci uniremo a voi, perch\u00E8 questa potrebbe essere la nostra unica occasione di andarcene da qui.
name1=Naufraghi
name2=Nativi
objective0=Raggiungi il punto di incontro.
objective1=Esegui un Boato Terrificante vicino al punto di incontro.
