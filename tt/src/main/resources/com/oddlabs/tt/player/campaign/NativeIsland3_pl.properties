header=Dyngjaskagi
description=Gunnar wspomnia\u0142 co\u015B o wielkim i gro\u017Anym bogu piorun\u00F3w, kt\u00F3ry przebywa na tej wyspie. C\u00F3\u017C, na pewno nie jest nawet w po\u0142owie tak mocny jak Pot\u0119\u017Cny Xarrr, ale mo\u017Ce jednak uda mu si\u0119 pom\u00F3c z t\u0105 s\u0142abn\u0105c\u0105 Trzeszcz\u0105c\u0105 Chmur\u0105.
header0=W\u00F3dz Ngumba
dialog0=To nasz cel - czas na ma\u0142y piknik. Lepiej si\u0119 jednak pospieszmy, wydaje mi si\u0119, \u017Ce Wikingowie te\u017C s\u0105 w drodze. Aha, i nie zbli\u017Cajcie si\u0119 zbytnio do tych wie\u017C.
header1=Thor
dialog1=Kto \u015Bmie wkroczy\u0107 na m\u00F3j p\u00F3\u0142wysep?!?
header2=W\u00F3dz Ngumba
dialog2=W\u00F3dz Ngumba i jego nieustraszeni wojownicy!
header3=Thor
dialog3=Ty bezczelny, malutki robaczku! Po\u017Ca\u0142ujesz tego!
header4=W\u00F3dz Ngumba
dialog4=Aiieeh, Wielki Xarrr, chro\u0144 nas!
header5=Thor
dialog5=Xarrr? Znasz go? To jeden z moich starych znajomych z Akademii Boga. \u015Awietny go\u015B\u0107!
header6=W\u00F3dz Ngumba
dialog6=Ehm, jasne. Nauczy\u0142 mnie kontrolowa\u0107 pogod\u0119, \u017Cebym m\u00F3g\u0142 razi\u0107 moich wrog\u00F3w w\u015Bciek\u0142ymi piorunami. Cho\u0107 z jakiego\u015B powodu to chyba nie dzia\u0142a w tym zimnym klimacie.
header7=Thor
dialog7=W takim razie na pewno nauczy\u0142 ci\u0119 te\u017C, jak przygotowa\u0107 ten pyszny "\u015Amierdz\u0105cy Gulasz", kt\u00F3ry gotowa\u0142 za dawnych, dobrych czas\u00F3w. Uwielbiam egzotyczne potrawy, ale moja \u017Cona wci\u0105\u017C serwuje mi to samo nudne mielone mi\u0119so wieprzowe i kaszank\u0119. Ugotuj mi troch\u0119 tego gulaszu, a pomog\u0119 ci rozwi\u0105za\u0107 problem z piorunami!
header8=W\u00F3dz Ngumba
dialog8=Nie ma problemu Thor, ugotuj\u0119 ci \u015Bmierdz\u0105cy gulasz!
name2=Stra\u017Cnicy
name4=Wikingowie
god=Thor
objective0=Id\u017A do Thora.
objective1=Przygotuj dla Thora \u015Bmierdz\u0105cy gulasz.
