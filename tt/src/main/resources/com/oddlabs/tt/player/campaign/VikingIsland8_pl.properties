header=Lumumgumphe
description=Statek nie mo\u017Ce przep\u0142yn\u0105\u0107 przez raf\u0119 z wodzem Fjorleifem i jego nieco oty\u0142ymi lud\u017Ami na pok\u0142adzie. Zamiast tego b\u0119d\u0105 musieli przeby\u0107 wysp\u0119 pieszo, podczas gdy oficer poprowadzi statek przez raf\u0119.
header0=W\u00F3dz Fjorleif
dialog0=Ostro\u017Cnie, ch\u0142opaki! Ta wyspa roi si\u0119 od wrogo nastawionych tubylc\u00F3w, wi\u0119c musimy patrze\u0107 pod nogi. Musimy dotrze\u0107 do punktu zbi\u00F3rki po drugiej stronie wyspy.
header1=Osi\u0105gni\u0119to punkt zbi\u00F3rki
dialog1=Dotar\u0142e\u015B do punktu zbi\u00F3rki. Daj sygna\u0142 swojemu statkowi, by przyp\u0142yn\u0105\u0142 po ciebie, wydaj\u0105c przera\u017Caj\u0105cy d\u017Awi\u0119k za pomoc\u0105 swojego lur.
header2=Steingrim \u0141amacz Czaszek
dialog2=Witaj! Nasz statek rozbi\u0142 si\u0119 na rafach, wi\u0119c od jakiego\u015B czasu tkwimy tu bez wyj\u015Bcia. Ukrywali\u015Bmy si\u0119 przed tubylcami w tej dolinie, wi\u0119c jeste\u015Bcie bardziej ni\u017C mile widziani! Z rado\u015Bci\u0105 do\u0142\u0105czymy do ciebie, bo to mo\u017Ce by\u0107 nasza jedyna szansa, by st\u0105d uciec.
name1=Rozbitkowie
name2=Tubylcy
objective0=Dotrzyj do punktu zbi\u00F3rki.
objective1=Zr\u00F3b przera\u017Caj\u0105cy d\u017Awi\u0119k w pobli\u017Cu miejsca zbi\u00F3rki.
