dialog0=!Saludos Jefe, sab\u00EDamos que vendr\u00EDa a rescatarnos\u00A1 Conseguimos escapar del campo de prisioneros pero hemos estado aqu\u00ED escondidos durante d\u00EDas, sin agua ni comida... Me temo que no estamos en muy buenas condiciones, as\u00ED que no vamos a ser de ninguna ayuda contra esos Vikingos.
header1=Jefe Ngumba
dialog1=No te preocupes, nosotros os protegeremos... aunque tenemos un peque\u00F1o problema: Nuestro barco golpe\u00F3 un arrecife y se est\u00E1 hundiendo lentamente, as\u00ED que tenemos que repararlo ya. Si tan s\u00F3lo pudi\u00E9ramos defender nuestro terreno durante un rato, podr\u00EDamos abandonar la isla y llevaros con nosotros.
game_over=Todos los prisioneros fueron asesinados. Fin de la partida.
