header=Guzumbabwe
description=Wir haben eine Menge bunter H\u00FChnchen auf dieser Insel gesehen. Ob die Eingeborenen sie f\u00FCr irgendwelche mysteri\u00F6sen Zwecke z\u00FCchten?
header0=H\u00E4uptling Fjorleif
dialog0=Unsere Kundschafter haben berichtet, dass die Eingeborenen die H\u00FChnchen offenbar zur Herstellung besonderer Waffen verwenden. Wir m\u00FCssen sie besiegen und ihr Geheimnis l\u00FCften!
header1=H\u00E4uptling Fjorleif
dialog1=Ihr Geheimnis war, dass sie die Schn\u00E4bel der H\u00FChnchen als Speerk\u00F6pfe verwenden. Ich habe eine Axt auf dieselbe Weise gebaut, wir k\u00F6nnen jetzt also Furcht erregende H\u00FChnchenkrieger bewaffnen.
name2=Eingeborene
objective=Vernichten Sie die Eingeborenen.
