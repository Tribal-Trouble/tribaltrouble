header=Dyngjaskagi
description=Gunnar mencion\u00F3 algo sobre un grandioso y formidable dios del trueno que resid\u00EDa en esta zona. Bueno, no hay ninguna posibilidad de que sea siquiera la mitad de poderoso que El Poderoso Xarrr, pero puede que sea de ayuda con esa Nube Neutrina que no funciona.
header0=Jefe Ngumba
dialog0=Este es nuestro destino... Hora de tomar una peque\u00F1a merienda. Aunque mejor nos damos algo de prisa, creo que los Vikingos tambi\u00E9n est\u00E1n de camino. Ah, y no os acerqu\u00E9is demasiado a esas torres.
header1=Thor
dialog1=\u00BF\u00A1\u00BFQui\u00E9n osa entrometerse en mi pen\u00EDnsula?!?
header2=Jefe Ngumba
dialog2=\u00A1El Jefe Ngumba y sus valientes guerreros!
header3=Thor
dialog3=\u00A1Impertinente peque\u00F1o insecto!\u00A1Vas a lamentar tus palabras!
header4=Jefe Ngumba
dialog4=*Aaaaahhh* Gran Xarrr, \u00A1prot\u00E9genos!
header5=Thor
dialog5=\u00BFXarrr?... \u00BFLe conoc\u00E9is?... Es uno de mis antiguos amigos de la academia de dioses. \u00A1Gran tipo!
header6=Jefe Ngumba
dialog6=Estoo, claro. \u00C9l me ense\u00F1\u00F3 a controlar el clima, as\u00ED que yo pod\u00EDa sacudir a mis enemigos con furiosos rel\u00E1mpagos. Pero por alguna causa, parece que no funciona en este clima.
header7=Thor
dialog7=Entonces tambi\u00E9n te habr\u00E1 ense\u00F1ado a hacer ese delicioso Puchero P\u00FAtrido que sol\u00EDa hacer en los viejos tiempos. Me encanta la comida ex\u00F3tica, pero mi parienta siempre me cocina el mismo aburrido cerdo troceado con morcilla. \u00A1Hazme un buen puchero y te ayudar\u00E9 con tu problema del rayo!
header8=Jefe Ngumba
dialog8=Sin problema, Thor. \u00A1Te preparar\u00E9 Puchero P\u00FAtrido!
name2=Guardias
name4=Vikingos
god=Thor
objective0=Encontrar a Thor.
objective1=Preparar un Puchero P\u00FAtrido para Thor.
