header=Togongolum
description=De acuerdo a ese chisme ind\u00EDgena, esta isla es el hogar de un viejo y sabio jefe tribal. Quiz\u00E1s \u00E9l podr\u00EDa darnos alguna informaci\u00F3n \u00FAtil si lo capturamos.
header0=Jefe Fjorleif
dialog0=Como esper\u00E1bamos, el jefe tribal est\u00E1 muy bien protegido. Elimina a sus guardias y capt\u00FArale para el interrogatorio.
header1=Jefe Mezumban
dialog1=\u00A1Por favor, no me hag\u00E1is da\u00F1o! Os dir\u00E9 todo lo que s\u00E9... Lejos, al sudeste de aqu\u00ED, hay una isla que no encontrar\u00E9is en vuestros mapas. Si consegu\u00EDs llegar a la cima de su monta\u00F1a, el gran dios del trueno, Xarrr, os conceder\u00E1 un deseo, a condici\u00F3n de que se lo pid\u00E1is amablemente.
game_over=El jefe tribal enemigo ha sido asesinado. Fin de la partida.
name2=Ind\u00EDgenas
name3=Mezumban
objective=Destruye a los nativos.\nCaptura vivo al Jefe Mezumban.
