header=V\u00F6llurstr\u00F6nd
description=L\u2019\u00EEle de Gunnar\u2026 Il para\u00EEt que certains des n\u00F4tres ont \u00E9t\u00E9 captur\u00E9s comme esclaves, peut-\u00EAtre qu\u2019ils sont ici. S\u2019ils y sont, il faut les lib\u00E9rer !
header0=Zimfubo le Z\u00E9l\u00E9
dialog0=Regardez, chef ! Gunnar avait raison, ils ont emmen\u00E9 les n\u00F4tres et les ont r\u00E9duits en esclavage. Montrez-leur votre courroux et l\u00E2chez un Nuage cr\u00E9pitant !
header1=Chef Ngumba
dialog1=Zut ! \u00C7a ne marche pas dans ce froid\u2026 Ou alors on est trop loin du domaine du Grand Xarrr. On dirait qu\u2019il va falloir faire \u00E7a \u00E0 l\u2019ancienne\u2026 Allons\u2011y !
header2=Chef Ngumba
dialog2=Vous \u00EAtes libres maintenant les petits, plus de corv\u00E9es pour les Vikings !\n\nAllez, ne restez pas l\u00E0 \u00E0 ne rien faire \u2014 construisez-moi un village pour qu\u2019on puisse rassembler une arm\u00E9e \u00E9norme et botter le derri\u00E8re de ces Vikings !
header3=Lumzumba le Paresseux
dialog3=*marmonne* *grognements*
header4=Chef Ngumba
dialog4=Quoi ?
header5=Lumzumba le Paresseux
