description=La isla de Gunnar. Antes nos cont\u00F3 que algunos de nuestros paisanos hab\u00EDan sido llevados presos, as\u00ED que quiz\u00E1s han acabado aqu\u00ED. Si est\u00E1n aqu\u00ED, \u00A1tenemos que liberarlos ya!
header0=Famfubo El Fan\u00E1tico
dialog0=\u00A1Mire Jefe! Gunnar ten\u00EDa raz\u00F3n, se han llevado algunos de nuestros nobles, probablemente para usarlos como rehenes. \u00A1Mu\u00E9streles su furia y libere una Nube Neutrina!
header1=Jefe Ngumba
dialog1=\u00A1Maldici\u00F3n! No puedo hacer que funcione con este fr\u00EDo. O quiz\u00E1s s\u00F3lo estamos demasiado lejos de los dominios del Gran Zarrr. Parece que vamos a tener que hacerlo a la antigua usanza... \u00A1Adelante!
header2=Jefe Ngumba
dialog2=\u00A1Ya sois libres peque\u00F1os compa\u00F1eros, se acab\u00F3 el tener que trabajar para esos Vikingos!\n\nBueno, \u00A1no os qued\u00E9is ah\u00ED parados, a trabajar y construidme un pueblo para que podamos crear un ej\u00E9rcito enorme con el que derrotar a esos Vikingos!
