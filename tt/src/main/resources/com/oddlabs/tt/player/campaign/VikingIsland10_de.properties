header=Kogafutshlum
description=Die verborgene Insel, auf deren h\u00F6chstem Berg der gro\u00DFe Donnergott Xarrr lebt. Wenn wir es bis zum Gipfel schaffen, gew\u00E4hrt er uns vielleicht einen Wunsch.
header0=H\u00E4uptling Fjorleif
dialog0=Das muss der Berg sein, von dem H\u00E4uptling Mozumba gesprochen hat. Wir m\u00FCssen den Gipfel erreichen, aber ich bin mir nicht so sicher, dass diese Eingeborenen uns so einfach ohne Kampf dorthin lassen. Vielleicht sollten wir einen anderen Weg suchen.
header1=H\u00E4uptling Fjorleif
dialog1=Endlich, wir haben den Gipfel erreicht! So, und wo ist nun dieser Donnergott ... ich sehe nur eine kleine, hutzelige Figur!
header2=Xarrr der Donnergott
dialog2=WAS F\u00DCHRT DICH ZU MIR, STERBLICHER?
header3=H\u00E4uptling Fjorleif
dialog3=Ups, die Figur spricht! \u00C4h, ja, also, ... Gro\u00DFer Xarrr, H\u00E4uptling Mozumba sagte mir, dass ... \u00E4h ... also, wenn wir deinen Berg besteigen, w\u00FCrdest du uns einen ... naja ... also ... einen ... \u00E4hem ... Wunsch ... gew\u00E4hren ...?
header4=Xarrr der Donnergott
dialog4=EINEN WUNSCH?
header5=H\u00E4uptling Fjorleif
dialog5=*schluck* Ja, so was in der Art hat er gesagt ...
header6=Xarrr der Donnergott
dialog6=Nun gut, was w\u00FCnschst du dir, Sterblicher?
header7=H\u00E4uptling Fjorleif
dialog7=\u00C4hm ... ich w\u00FCnsche mir, dass meine Feinde vor mir zu Staub zerfallen!
header8=Xarrr der Donnergott
dialog8=Okidokie, dann sollst du von jetzt an mit deiner Lure einen Destruktiven Donner erzeugen k\u00F6nnen, der alles und jeden in deiner N\u00E4he zu Staub zerfallen l\u00E4sst!
header9=H\u00E4uptling Fjorleif
dialog9=Cool, danke ... so sagt man doch, oder ... ?
header10=Xarrr der Donnergott
dialog10=Wenn ihr mich jetzt entschuldigen wollt ... ich muss mich noch um ein paar Unwetter k\u00FCmmern.
header11=H\u00E4uptling Fjorleif
dialog11=Hmm, das k\u00F6nnte das furchtbare Unwetter erkl\u00E4ren, aufgrund dessen wir \u00FCberhaupt hier gestrandet sind. Egal, probieren wir den Destruktiven Donner lieber aus, bevor wir weiter m\u00FCssen. Am besten jetzt und hier.
statue=Xarrr der Donnergott
name2=Eingeborene
objective0=Schlagen Sie sich bis zum Gipfel durch.
objective1=Lassen Sie einen Destruktiven Donner vom Gipfel erschallen.
