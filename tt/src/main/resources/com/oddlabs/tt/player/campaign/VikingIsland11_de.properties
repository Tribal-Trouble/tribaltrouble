header=Fufupogo
description=Das Schiff eines unserer Rivalen wurde nahe dieser Insel gesichtet. Vielleicht hat man dort auch vom Schatz der Eingeborenen geh\u00F6rt.
header0=H\u00E4uptling Fjorleif
dialog0=Oh nein, mein Erzrivale Egill Eierkopf hat diese Insel erobert! Der ist bestimmt auch hinter dem Schatz der Eingeborenen her. Mist, ich glaube, er hat uns entdeckt!
header1=Egill Eierkopf
dialog1=Fjorleif Furzhose, dass wir uns hier treffen!
header2=H\u00E4uptling Fjorleif
dialog2=*Grrrhh* ... Nenn mich nicht bei meinem vollen Namen, wenn die M\u00E4nner dabei sind!
header3=Egill Eierkopf
dialog3=Nun ja, ich bin gekommen, um dir mitzuteilen, dass diese Inselgruppe nun Eigentum der Eierkopf Pl\u00FCnder-AG ist, und dass hier nur derjenige das Zutrittsrecht hat, der t\u00E4glich eine Pl\u00FCndergeb\u00FChr in H\u00F6he von einem Fass Gold abdr\u00FCckt. Bist du damit einverstanden?
header4=H\u00E4uptling Fjorleif
dialog4=Wie bitte?!? Wir waren ja wohl zuerst hier!
header5=Egill Eierkopf
dialog5=Offensichtlich doch nicht! Ich werte das dann als Nein. Meine Krieger werden daf\u00FCr sorgen, dass ihr auf brutale und relativ unangenehme Weise von dieser Insel bef\u00F6rdert werdet. Guten Tag!
header6=H\u00E4uptling Fjorleif
dialog6=Diese Ratte ... damit kommt er nicht durch!
header7=Knut der Knecht
dialog7=Furzhose, ja?
header8=H\u00E4uptling Fjorleif
dialog8=Maul halten und k\u00E4mpfen!
name2=Eierk\u00F6pfe
objective=Vernichten Sie die Eierk\u00F6pfe.
