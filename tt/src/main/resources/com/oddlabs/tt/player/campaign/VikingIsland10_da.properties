header=Kogafutshlum
description=Den skjulte \u00F8 hvor den store tordengud Xarrr bor p\u00E5 toppen af bjerget. Hvis vi n\u00E5r op p\u00E5 toppen, f\u00E5r vi m\u00E5ske opfyldt et \u00F8nske.
header0=H\u00F8vding Fjorleif
dialog0=Det m\u00E5 v\u00E6re det her bjerg, H\u00F8vding Mozumba snakkede om. Vi m\u00E5 n\u00E5 op p\u00E5 toppen, men jeg er ikke sikker p\u00E5, de indf\u00F8dte vil lade os passere uden kamp. M\u00E5ske kan vi finde en anden vej rundt?
header1=H\u00F8vding Fjorleif
dialog1=Endelig, vi n\u00E5ede toppen! N\u00E5, hvor er den tordengud... jeg kan ikke se andet end en grim statue!
header2=Xarrr
dialog2=HVAD BRINGER DIG TIL MIT RIGE, D\u00D8DELIGE?
header3=H\u00F8vding Fjorleif
dialog3=Argh, statuen taler! \u00D8hm... \u00E5h, store Xarrr, H\u00F8vding Mozumba fortalte mig, at hvis vi klatrede op ad dit bjerg, s\u00E5 ville du v\u00E6re s\u00E5 venlig at opfylde et ... \u00F8h ...
header4=Xarrr
dialog4=ET \u00D8NSKE?
header5=H\u00F8vding Fjorleif
dialog5=*gylp* Ja, det var det!
header6=Xarrr
dialog6=Nuvel, hvad \u00F8nsker du dig, d\u00F8delige?
header7=H\u00F8vding Fjorleif
dialog7=\u00D8hm... Jeg \u00F8nsker, at mine fjender falder for mine f\u00F8dder!
header8=Xarrr
dialog8=OK, fra nu af vil du v\u00E6re i stand til at bruge din lur til at bl\u00E6se et Bragende Br\u00F8l, der vil knuse alt i n\u00E6rheden af dig!
header9=H\u00F8vding Fjorleif
dialog9=Orv, tak ... eller noget.
header10=Xarrr
dialog10=N\u00E5, hvis du vil have mig undskyldt... jeg har en tordenstorm at tage mig af.
header11=H\u00F8vding Fjorleif
dialog11=Hmm... det forklarer m\u00E5ske den voldsomme tordenstorm, der bragte os hertil til at begynde med. N\u00E5, jeg m\u00E5 hellere f\u00E5 pr\u00F8vet det Bragende Br\u00F8l, inden vi g\u00E5r videre. Bare lav en lille demonstration lige her.
statue=Xarrr
name2=Indf\u00F8dte
objective0=N\u00E5 op til toppen af bjerget.
objective1=Bl\u00E6s et Bragende Br\u00F8l fra toppen af bjerget.
