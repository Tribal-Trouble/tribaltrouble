dialog0=Keine Sorge, wir werden diesen Wilden eine Lektion erteilen! Danach k\u00F6nnen wir uns zusammentun.
header1=Ulfr der Ungewaschene
dialog1=Verflucht noch eins! Dieser verdammte Gunnar und seine idiotischen Ideen. Er hat uns befohlen, diese Insel zu pl\u00FCndern, w\u00E4hrend er eine andere unter die Fittiche nahm. Aber jetzt hat er uns hier ohne Waffen zur\u00FCckgelassen, und noch dazu sind wir den Eingeborenen zahlenm\u00E4\u00DFig absolut unterlegen. Wenn ihr uns helft, werden wir zu euch \u00FCberlaufen.
game_over=Alle Verb\u00FCndeten wurden get\u00F6tet. Game over.
