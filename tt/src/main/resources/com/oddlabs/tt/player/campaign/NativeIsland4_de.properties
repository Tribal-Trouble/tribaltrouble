header=J\u00F6kullhnj\u00FAkur
description=Die gef\u00FCrchtete Gefangeneninsel der Wikinger. Hier halten sie die widerborstigsten ihrer H\u00E4ftlinge gefangen.
header0=Fufubi Flachkopf
dialog0=Gott zum Gru\u00DFe, Chef. Wir wussten, dass du uns zu Hilfe kommen w\u00FCrdest! Wir sind aus dem Gefangenencamp entkommen, aber jetzt h\u00E4ngen wir schon seit Tagen ohne Wasser oder Nahrung in diesem Versteck fest ... Ich f\u00FCrchte, wir sind in ziemlich \u00FCbler Verfassung. Gegen die Wikinger k\u00F6nnen wir dir also nicht behilflich sein.
header1=H\u00E4uptling Ngumba
dialog1=Keine Sorge, wir werden euch besch\u00FCtzen, aber es gibt da ein kleines Problem: Unser Schiff ist auf ein Riff gelaufen und leckgeschlagen, wir m\u00FCssen es also reparieren. Wenn wir sie uns nur eine Weile vom Leib halten k\u00F6nnen, dann k\u00F6nnen wir von dieser Insel entkommen und euch mitnehmen.
game_over=Alle H\u00E4ftlinge wurden get\u00F6tet. Game over.
name1=Gefangene
name2=Wikinger
objective=Besch\u00FCtzen Sie die Gefangenen {0} Minuten lang.
