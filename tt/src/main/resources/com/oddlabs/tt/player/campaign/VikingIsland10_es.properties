header=Kogafutshlum
description=La isla oculta donde el Gran dios del trueno Xarrr descansa en la cima de su monta\u00F1a. Si llegamos a la cima, podemos ser bendecidos con un deseo.
header0=Jefe Fjorleif
dialog0=Esta tiene que ser la monta\u00F1a que mencion\u00F3 el Jefe Mezumban. Debemos alcanzar la cima, pero no s\u00E9 si esos ind\u00EDgenas nos dejar\u00E1n pasar sin luchar. Quiz\u00E1s podamos encontrar otra ruta dando un rodeo.
header1=Jefe Fjorleif
dialog1=\u00A1Al fin, llegamos a la cima! Y ahora, \u00BFD\u00F3nde est\u00E1 el dios del trueno ese?... \u00A1lo \u00FAnico que veo es una fea y peque\u00F1a estatua!
header2=Xarrr
dialog2=\u00BFQU\u00C9 TE TRAE A MI HOGAR, MORTAL?
header3=Jefe Fjorleif
dialog3=\u00A1Qu\u00E9... la estatua habla! Hmmmm... oh, Gran Xarrr, el Jefe Mezumban me cont\u00F3 que si sub\u00EDamos hasta la cima de la monta\u00F1a, tu podr\u00EDas ser tan amable de concedernos un.... em..... un....
header4=Xarrr
dialog4=\u00BFUN DESEO?
header5=Jefe Fjorleif
dialog5=*glup* S\u00ED, \u00A1eso!
header6=Xarrr
dialog6=MUY BIEN, \u00BFQU\u00C9 DESEAS, MORTAL?
header7=Jefe Fjorleif
dialog7=Ahmmm... \u00A1Me gustar\u00EDa que mis enemigos se desmoronaran ante m\u00ED!
header8=Xarrr
dialog8=DE ACUERDO, \u00A1DESDE AHORA PODR\u00C1S USAR TU LUR PARA CREAR UN RUGIDO ROMPEDOR QUE ROMPER\u00C1 TODO LO QUE EST\u00C9 CERCA DE T\u00CD!
header9=Jefe Fjorleif
dialog9=Guau, gracias... supongo.
header10=Xarrr
dialog10=AHORA, SI ME DISCULPAS... TENGO TORMENTAS QUE ATENDER.
header11=Jefe Fjorleif
dialog11=Hmm... eso podr\u00EDa explicar la terrible tormenta que nos trajo hasta aqu\u00ED en un principio. Bueno, ser\u00E1 mejor probar el nuevo Rugido Rompedor antes de ir a ning\u00FAn sitio. Hagamos una peque\u00F1a prueba aqu\u00ED mismo.
statue=Xarrr El Atronador
name2=Ind\u00EDgenas
objective0=Alcanzar la cima de la monta\u00F1a.
objective1=Hacer un Rugido Rompedor desde lo alto de la monta\u00F1a.
