header=Gutshumdi
description=Din f\u00E6tter, Gunnar den Godtroende, pr\u00F8ver at erobre denne \u00F8, men han kunne godt bruge noget hj\u00E6lp med at smadre de indf\u00F8dtes lejre. Hvis du hj\u00E6lper ham, kan det v\u00E6re han l\u00E5ner dig nogle af sine m\u00E6nd.
header0=H\u00F8vding Fjorleif
dialog0=OK, lad is smadre hytterne! Pas p\u00E5 ikke at skade vores venner.
header1=H\u00F8vding Gunnar
dialog1=Jeg fatter det ikke, de indf\u00F8dte kastede spyd efter os! Hvis du hj\u00E6lper os med at udslette dem, vil vi bel\u00F8nne dig.
header2=H\u00F8vding Gunnar
dialog2=Tak for din hj\u00E6lp! Jeg vil l\u00E5ne dig 5 af mine bedste krigere til at hj\u00E6lpe dig med din farefulde f\u00E6rd.
game_over=Gunnars stamme blev udslettet. Spillet er slut.
name1=Allierede
name2=Indf\u00F8dte
