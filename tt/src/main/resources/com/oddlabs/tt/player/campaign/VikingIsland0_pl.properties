header0=Petur Robotnik
dialog0=O rany, co za katastrofa! Nie do\u015B\u0107, \u017Ce znowu za du\u017Co wypili\u015Bmy, to jeszcze dopad\u0142a nas gwa\u0142towna burza, kt\u00F3ra trwa\u0142a ca\u0142ymi dniami. A\u017C strach pomy\u015Ble\u0107, gdzie nas wyrzuci\u0142o. Po\u0142owa za\u0142ogi zagin\u0119\u0142a, a W\u00F3dz Fjorleif wypad\u0142 za burt\u0119 gdzie\u015B w pobli\u017Cu tej wyspy. My\u015Bl\u0119, \u017Ce tubylcy trzymaj\u0105 go w niewoli... musimy go uwolni\u0107!
header1=W\u00F3dz Fjorleif
dialog1=Dobra robota, ch\u0142opaki! Kiedy by\u0142em wi\u0119ziony przez tubylc\u00F3w, uda\u0142o mi si\u0119 skopiowa\u0107 jedn\u0105 z ich map. My\u015Bl\u0119, \u017Ce ukryli jakie\u015B skarby na wi\u0119kszych wyspach. Stracili\u015Bmy ca\u0142y nasz \u0142up podczas sztormu, a strach pomy\u015Ble\u0107, co zrobi\u0142yby nam nasze \u017Cony, gdyby\u015Bmy wr\u00F3cili z tej wyprawy z pustymi r\u0119kami. Do roboty!
game_over=W\u00F3dz Fjorleif zosta\u0142 zabity. Koniec gry.
name1=Fjorleif
name2=Tubylcy
objective=Zniszcz tubylc\u00F3w.\nUratuj wodza.
