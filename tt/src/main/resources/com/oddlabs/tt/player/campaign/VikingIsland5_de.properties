header=Gutshumdi
description=Gunnar der Gutgl\u00E4ubige versucht die Insel zu erobern, aber er k\u00F6nnte wohl etwas Hilfe beim Plattmachen der Eingeborenensiedlungen gebrauchen. Als Gegenleistung f\u00FCr ein bisschen Unterst\u00FCtzung stellt er vielleicht ein paar seiner M\u00E4nner ab.
header0=H\u00E4uptling Fjorleif
dialog0=OK, diese H\u00FCtten machen wir platt! Aber Vorsicht - unsere Freunde sollten wir nicht erwischen!
header1=H\u00E4uptling Gunnar
dialog1=Das glaube ich einfach nicht! Die Eingeborenen haben Speere nach uns geworfen! Wer uns hilft, sie auszul\u00F6schen, soll angemessen belohnt werden!
header2=H\u00E4uptling Gunnar
dialog2=Vielen Dank f\u00FCr die Hilfe! Ich werde 5 meiner besten Krieger f\u00FCr die Mission zur Verf\u00FCgung stellen!
game_over=Gunnars Stamm wurde get\u00F6tet. Game over.
