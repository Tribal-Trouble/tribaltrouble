header=Fufupogo
description=En af vores rivalers skibe er blevet set i n\u00E6rheden af denne \u00F8. M\u00E5ske har de ogs\u00E5 h\u00F8rt om de indf\u00F8dtes skatte.
header0=H\u00F8vding Fjorleif
dialog0=\u00C5h nej, min \u00E6rkerival Egill Ejeglad har erobret \u00F8en. Ingen tvivl om, at han ogs\u00E5 er ude efter de indf\u00F8dtes skat. Argh, jeg tror han har set os!
header1=Egill Ejeglad
dialog1=Fjorleif Fj\u00E6rtebuks, vi m\u00F8des igen!
header2=H\u00F8vding Fjorleif
dialog2=*Skumle* ... Lad v\u00E6re med at bruge mit fulde navn n\u00E5r mine m\u00E6nd h\u00F8rer det!
header3=Egill Ejeglad
dialog3=N\u00E5, men jeg er her for at informere dig om, at denne \u00F8gruppe tilh\u00F8rer Ejeglad Plyndring A/S, og at din tilstedev\u00E6relse kr\u00E6ver, at du betaler et plyndregebyr p\u00E5 en t\u00F8nde guld om dagen. Accepterer du disse betingelser?
header4=H\u00F8vding Fjorleif
dialog4=Hvad?!? Men vi var her f\u00F8rst!
header5=Egill Ejeglad
dialog5=Tydeligvis ikke. Jeg tager det som et nej. Mine krigere vil s\u00F8rge for at du bliver smidt v\u00E6k fra \u00F8en p\u00E5 en voldsom og generelt ubehagelig m\u00E5de. Ha'' en fortsat god dag!
header6=H\u00F8vding Fjorleif
dialog6=Det svin... Det skal han ikke slippe godt fra!
header7=Bjarke Bonder\u00F8v
dialog7=Heh, Fj\u00E6rtebuks?
header8=H\u00F8vding Fjorleif
dialog8=Bare hold k\u00E6ft og k\u00E6mp!
name2=E.P. A/S
objective=Udslet Ejeglad Plyndring A/S
