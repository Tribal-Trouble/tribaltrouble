header=V\u00F6llurstr\u00F6nd
description=Gunnars \u00F8. Han fortalte os, at nogle af vores landsm\u00E6nd blev taget til fange, s\u00E5 m\u00E5ske er de endt her. Hvis de er det, m\u00E5 vi straks befri dem!
header0=Fimzubo Fanatikeren
dialog0=Se h\u00F8vding! Gunnar havde ret, de har taget nogle af vores landsm\u00E6nd med sig, formentlig for at bruge dem som tr\u00E6lle. Vis din vrede og slip en Tosset Tordensky l\u00F8s!
header1=H\u00F8vding Ngumba
dialog1=Forbandet! Jeg kan ikke f\u00E5 den til at virke i det her kolde klima. Eller m\u00E5ske er vi bare for langt v\u00E6k fra den store Xarrr. Det ser ud til, at vi bliver n\u00F8dt til at ordne det p\u00E5 den gode gammeldags m\u00E5de... Angrib!
header2=H\u00F8vding Ngumba
dialog2=S\u00E5 er I fri, sm\u00E5 venner. Ikke mere slid og sl\u00E6b for de vikinger!\n\nN\u00E5, hold op med bare at st\u00E5 der - kom igang med at bygge en lejr, s\u00E5 vi kan samle en stor h\u00E6r til at smadre vikingerne!
header3=Dumzumba Dovenpind
dialog3=*mumle* *skumle*
header4=H\u00F8vding Ngumba
dialog4=Hvad?
header5=Dumzumba Dovenpind
dialog5=\u00D8h, javel h\u00F8vding, med det samme!
