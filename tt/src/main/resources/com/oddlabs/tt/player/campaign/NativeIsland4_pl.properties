header1=W\u00F3dz Ngumba
dialog1=Nie martw si\u0119, zapewnimy ci ochron\u0119, ale mamy ma\u0142y problem: nasz statek uderzy\u0142 w raf\u0119 i nabiera wody, wi\u0119c musimy go naprawi\u0107. Je\u015Bli tylko uda nam si\u0119 przez chwil\u0119 utrzyma\u0107 pozycj\u0119, b\u0119dziemy mogli opu\u015Bci\u0107 t\u0119 wysp\u0119 i zabra\u0107 ci\u0119 ze sob\u0105.
