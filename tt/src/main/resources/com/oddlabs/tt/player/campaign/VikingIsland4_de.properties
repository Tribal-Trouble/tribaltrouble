header=Gobazumbi
description=In den Gew\u00E4ssern nahe dieser Insel wurden die \u00DCberreste eines Wikingerschiffs entdeckt. Vielleicht gibt es dort noch mutige Wikinger, die dasselbe Schicksal erleiden mussten wie wir.
header0=H\u00E4uptling Fjorleif
dialog0=Es zeigte sich, dass das Wrack meinem Cousin Gunnar dem Gutgl\u00E4ubigen geh\u00F6rt, der jetzt von den Eingeborenen gefangen gehalten wird. Los, befreien wir ihn!
header1=H\u00E4uptling Gunnar
dialog1=Danke f\u00FCr die Rettungsaktion! Ich h\u00E4tte vielleicht auf meine M\u00E4nner h\u00F6ren sollen, aber ich habe wirklich geglaubt, dass die Eingeborenen uns alle zum Abendessen einladen wollten. Aber wenigstens hatte ich die Gelegenheit, mein Lurenspiel ein bisschen zu \u00FCben. Jetzt kann ich euch beibringen, wie man ein Gr\u00E4ssliches Gedudel von sich gibt, mit dem sich Feinde f\u00FCr kurze Zeit bet\u00E4uben lassen.
game_over=H\u00E4uptling Gunnar wurde get\u00F6tet. Game over.
name1=Gunnar
name2=Eingeborene
objective=Vernichten Sie die Eingeborenen.\nBefreien Sie Gunnar.
