header0=Petur le Peon
dialog0=Oh l\u00E0 l\u00E0, quel d\u00E9sastre ! Non seulement nous avons encore trop bu, mais nous avons aussi \u00E9t\u00E9 frapp\u00E9s par un orage furieux qui a dur\u00E9 des jours. On se demande bien o\u00F9 nous avons \u00E9chou\u00E9. La moiti\u00E9 de l\u2019\u00E9quipage a disparu et le chef Fjorleif est tomb\u00E9 par-dessus bord quelque part pr\u00E8s de cette \u00EEle. Je crois qu\u2019il est prisonnier des natifs\u2026 il faut le lib\u00E9rer !
header1=Chef Fjorleif
dialog1=Bien jou\u00E9, les gars ! Pendant que j\u2019\u00E9tais prisonnier des natifs, j\u2019ai r\u00E9ussi \u00E0 copier une de leurs cartes. Je pense qu\u2019ils ont cach\u00E9 un tr\u00E9sor sur les grandes \u00EEles. Nous avons perdu tout notre butin dans la temp\u00EAte et je n\u2019ose imaginer ce que nos femmes nous feraient si nous revenions les mains vides\u2026 alors au boulot !
game_over=Le chef Fjorleif a \u00E9t\u00E9 tu\u00E9. Partie termin\u00E9e.
name1=Fjorleif
name2=Natifs
objective=\u00C9liminez les natifs.\nSauvez le chef.
