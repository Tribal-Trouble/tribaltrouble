header0=Jefe Ngumba
dialog0=Esos malditos vikingos no parar\u00E1n hasta que tengan todas y cada una de nuestras estatuas sagradas. \u00A1Y Parece que vienen hacia aqu\u00ED ahora!
header1=Jefe Ngumba
dialog1=Valientes o no, no creo que tengamos ni una oportunidad contra ese ej\u00E9rcito. Mejor me vuelvo a la playa  y... emmmm... consigo algunos refuerzos. \u00A1Aguantad hasta que vuelva!
header2=Jefe Ngumba
dialog2=\u00A1Bienhallados, muchachos! Necesito vuestra ayuda ahora mismo.
header3=Nufungu El No-tan-feroz
dialog3=Demasiado tarde, ese t\u00EDo, Fjorleif, ya ha saqueado todas nuestras estatuas y parti\u00F3 mar adentro. Encima, \u00A1se llev\u00F3 unos cuantos pollos tropicales! Pero no todo est\u00E1 perdido, acaban de decirme que su est\u00FApido primo, Gunnar, ha sido avistado en el otro lado de la isla.
header4=Jefe Ngumba
dialog4=En ese caso no hay tiempo que perder. Vamos a capturar y a interrogar a Gunnar. Si alguien sabe hacia donde se dirige Fjorleif, debe que ser \u00E9l.
header5=Jefe Gunnar El Gazn\u00E1piro
dialog5=De acuerdo, lo pillo, \u00A1Me rindo! Os devolveremos vuestras estatuas y partiremos de vuelta a casa.
header6=Jefe Ngumba
dialog6=\u00A1Tu primo Fjorleif ya rob\u00F3 hasta la \u00FAltima de ellas, idiota! Y a menos que quieras que te exprimamos usando ese cuerno que llevas, nos vas a contar d\u00F3nde podemos encontrar a Fjorleif y nuestras preciosas estatuas.
header7=Jefe Gunnar EL Gazn\u00E1piro
dialog7=\u00A1Aaaaah, no mi se\u00F1or! Os ayudar\u00E9 a dibujar un mapa de nuestras islas.
name1=Nuevos Ind\u00EDgenas
name2=Vikingos
name3=Ind\u00EDgenas
statue=Estatua de oro
objective0=Retrocede hasta la playa y encuentra los refuerzos.
objective1=Destruye a los Vikingos.
