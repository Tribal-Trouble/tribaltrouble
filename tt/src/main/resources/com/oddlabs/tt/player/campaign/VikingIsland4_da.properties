header=Gobazumbi
description=Vi har opdaget resterne af et vikingeskib i havet omkring denne \u00F8. M\u00E5ske er der andre modige vikinger, der har lidt samme sk\u00E6bne som os.
header0=H\u00F8vding Fjorleif
dialog0=Skibsvraget viste sig at tilh\u00F8re min f\u00E6tter Gunnar den Godtroende, som nu bliver holdt som fange af de indf\u00F8dte. Lad os hj\u00E6lpe ham!
header1=H\u00F8vding Gunnar
dialog1=Tak fordi du befriede mig, f\u00E6tter! Jeg skulle m\u00E5ske have lyttet til mine m\u00E6nd, men jeg var sikker p\u00E5, at de indf\u00F8dte ville invitere os allesammen til middag. Jeg fik dog tr\u00E6net mine f\u00E6rdigheder p\u00E5 lur en smule. Lad mig l\u00E6re dig hvordan du laver et Terror Trut, der kan lamme dine fjender i et stykke tid.
game_over=H\u00F8vding Gunnar blev dr\u00E6bt. Spillet er slut.
name1=Gunnar
name2=Indf\u00F8dte
objective=Udslet de indf\u00F8dte.\nBefri Gunnar.
