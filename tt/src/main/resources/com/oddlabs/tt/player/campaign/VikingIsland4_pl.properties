header=Gobazumbi
description=W wodach w pobli\u017Cu tej wyspy zauwa\u017Cono szcz\u0105tki statku wiking\u00F3w. By\u0107 mo\u017Ce s\u0105 tu inni dzielni wikingowie, kt\u00F3rych spotka\u0142 ten sam los, co nas.
header0=W\u00F3dz Fjorleif
dialog0=Okaza\u0142o si\u0119, \u017Ce wrak nale\u017Ca\u0142 do mojego kuzyna Gunnara Naiwnego, kt\u00F3ry jest teraz przetrzymywany przez tubylc\u00F3w. Pom\u00F3\u017Cmy mu!
header1=W\u00F3dz Gunnar
dialog1=Dzi\u0119ki za uwolnienie! Mo\u017Ce i powinienem by\u0142 pos\u0142ucha\u0107 moich ludzi, ale by\u0142em \u015Bwi\u0119cie przekonany, \u017Ce tubylcy chc\u0105 zaprosi\u0107 nas wszystkich na kolacj\u0119. Przynajmniej po\u0107wiczy\u0142em troch\u0119 gr\u0119 na lurze. Daj mi nauczy\u0107 ci\u0119, jak wydoby\u0107 "Przera\u017Caj\u0105cy d\u017Awi\u0119k", kt\u00F3ry potrafi og\u0142uszy\u0107 wrog\u00F3w na kr\u00F3tk\u0105 chwil\u0119.
game_over=W\u00F3dz Gunnar zosta\u0142 zabity. Koniec gry.
name1=Gunnar
name2=Tubylcy
objective=Zniszcz tubylc\u00F3w.\nUratuj Gunnara.
