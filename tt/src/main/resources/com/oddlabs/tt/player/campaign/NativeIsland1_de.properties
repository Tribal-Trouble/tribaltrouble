header=V\u00F6llurstr\u00F6nd
description=Gunnars Insel. Er hat uns gesagt, dass einige unserer Br\u00FCder als Leibeigene gehalten werden. Vielleicht sind ja ein paar von ihnen hier. In diesem Fall m\u00FCssen wir sie sofort befreien!
header0=Zimfubo der Zwieselige
dialog0=Sieh mal, H\u00E4uptling! Gunnar hatte Recht, sie haben einige unserer Br\u00FCder verschleppt, wahrscheinlich, um sie als Leibeigene auszubeuten. Zeig ihnen, wie w\u00FCtend du bist, und setz eine Wummernde Wolke frei!
header1=H\u00E4uptling Ngumba
dialog1=Verdammt! In dieser K\u00E4lte funktioniert das nicht. Oder vielleicht haben wir uns einfach zu weit vom Gebiet des Gro\u00DFen Xarrr entfernt. Offenbar m\u00FCssen wir das auf die althergebrachte Art erledigen ... los geht''s!
header2=H\u00E4uptling Ngumba
dialog2=Nun seid ihr frei, ihr kleinen Kerle, jetzt hat die Schufterei f\u00FCr die Wikinger ein Ende!\n\nJetzt steht hier nicht so rum - macht euch an die Arbeit und baut mir ein Dorf, damit wir eine riesige Armee aufbauen und diese Wikinger schlagen k\u00F6nnen!
header3=Lumzumba der Lahme
dialog3=*m\u00FCmpf* *grummel*
header4=H\u00E4uptling Ngumba
dialog4=Was?
header5=Lumzumba der Lahme
dialog5=\u00C4h, ja Chef, geht klar!
captive=Gefangener
