header=Var\u00F0ask\u00F3gur
description=Vielleicht ist das die geheime Insel, \u00FCber die Grimhildur Gr\u00FCtzenfresser gesprochen hat, als er sagte, dass Fjorleif mit den Statuen westw\u00E4rts gesegelt ist.
header0=H\u00E4uptling Ngumba
dialog0=D\u00FCnnschiss und Darmam\u00F6ben! Hier sind auch keine Statuen! Wenigstens haben offenbar einige unserer Landsleute ein St\u00FCckchen weiter ihr Lager aufgeschlagen.
header1=H\u00E4uptling Gotoba
dialog1=Seid gepriesen, H\u00E4uptling Ngumba! Wir sind eine Gruppe ehemaliger Leibeigener, die in die Freiheit entkommen sind. Dank der Gr\u00F6\u00DFe der Insel konnten wir uns bisher vor den Wikingern verstecken. Wir schlagen hier unser Lager auf, damit wir ein Schiff bauen und nach Hause segeln k\u00F6nnen!
header2=H\u00E4uptling Ngumba
dialog2=Wie w\u00E4re es denn, wenn wir uns zusammentun und die Wikinger von dieser Insel vertreiben? Ich k\u00F6nnte mir vorstellen, dass euer Schiffsbau um einiges schneller vorank\u00E4me, wenn euch die Wikinger nicht immer ablenken w\u00FCrden.
header3=H\u00E4uptling Gotoba
dialog3=Klingt gut ... Auf zum Wikingerkn\u00FCppeln!
header4=Ngolongo Noppenfu\u00DF
dialog4=Hey, Chef, wir haben eine interessante Karte in den Ruinen gefunden. Sie zeigt eine Insel, von der wir bisher nichts wussten. Ich habe sie mal in unserer Karte eingezeichnet. Vielleicht hat sich Fjorleif ja hier verkrochen?
game_over=Alle Verb\u00FCndeten wurden get\u00F6tet. Game over.
name1=Verb\u00FCndete
name2=Wikinger
name3=Wikinger
objective=Vernichten Sie die Wikinger.\nBesch\u00FCtzen Sie Ihre Verb\u00FCndeten.
