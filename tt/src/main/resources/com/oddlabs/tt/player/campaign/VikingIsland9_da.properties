header=Togongolum
description=If\u00F8lge rygter blandt de indf\u00F8dte, bor der en meget gammel og vis h\u00F8vding p\u00E5 denne \u00F8. M\u00E5ske kan han afsl\u00F8re noget nyttigt, hvis vi kan fange ham.
header0=H\u00F8vding Fjorleif
dialog0=Som forventet er h\u00F8vdingen godt beskyttet. Udslet hans krigere og bring ham til afh\u00F8ring.
header1=H\u00F8vding Mozumba
dialog1=Vis n\u00E5de! Jeg skal nok fort\u00E6lle dig, hvad jeg ved.. Fjernt mod syd\u00F8st er der en \u00F8, som du ikke kan se p\u00E5 dit kort. Hvis det lykkes dig at komme op p\u00E5 toppen af bjerget p\u00E5 denne \u00F8, vil den store tordengud Xarrr opfylde et \u00F8nske for dig. Selvf\u00F8lgelig kun hvis du sp\u00F8rger p\u00E6nt.
game_over=Fjendens h\u00F8vding blev dr\u00E6bt. Spillet er slut.
name2=Indf\u00F8dte
name3=Mozumba
objective=Udslet de indf\u00F8dte.\nTag h\u00F8vding Mozumba til fange.
