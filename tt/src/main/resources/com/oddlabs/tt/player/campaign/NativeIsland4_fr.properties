header=J\u00F6kullhnj\u00FAkur
description=L\u2019\u00EEle-prison redout\u00E9e des Vikings, o\u00F9 ils gardent les prisonniers les plus redoutables.
header0=Fufubi l'incapable
dialog0=Salut, \u00F4 grand chef ! On savait que vous viendriez \u00E0 notre secours ! Nous avons r\u00E9ussi \u00E0 nous \u00E9chapper du camp de prisonniers, mais nous nous cachons ici depuis des jours, sans eau ni nourriture\u2026 Je crains que notre \u00E9tat soit assez mauvais, alors nous ne pouvons pas vous aider \u00E0 combattre les Vikings.
header1=Chef Ngumba
dialog1=Ne vous inqui\u00E9tez pas, nous allons vous prot\u00E9ger, mais nous avons un petit probl\u00E8me : notre navire a heurt\u00E9 un r\u00E9cif et prend l\u2019eau. Il faut le r\u00E9parer. Si nous tenons bon un peu de temps, nous pourrons quitter cette \u00EEle et vous emmener avec nous.
game_over=Tous les prisonniers ont \u00E9t\u00E9 tu\u00E9s. Partie termin\u00E9e.
name1=Captifs
