header=Var\u00F0ask\u00F3gur
description=M\u00E5ske er det her den hemmelige \u00F8 Grimhildur Gunnarsen talte om, da han sagde, at Fjorleif sejlede mod vest med statuerne.
header0=H\u00F8vding Ngumba
dialog0=D\u00F8d og diarr\u00E9, heller ingen statuer her! I det mindste ser det da ud som om nogle af vores landsm\u00E6nd har bygget en lejr et stykke oppe af kysten.
header1=H\u00F8vding Gotoba
dialog1=V\u00E6r hilset, H\u00F8vding Ngumba! Vi er en gruppe af tidligere tr\u00E6lle, der er flygtet. Takket v\u00E6re den enorme st\u00F8rrelse af denne \u00F8 har det lykkedes os at holdes os skjult for vikingerne. Vi er ved at etablere en lejr, s\u00E5 vi kan bygge et skib og sejle hjem.
header2=H\u00F8vding Ngumba
dialog2=Hvad med at vi samarbejder om at drive vikingerne bort fra \u00F8en? Uden vikinger til at blande sig er jeg sikker p\u00E5 jeres b\u00E5dprojekt vil v\u00E6re langt nemmere.
header3=H\u00F8vding Gotoba
dialog3=Lyder som en god plan... tid til vikingejagt!
header4=Lgonongo Letp\u00E5t\u00E5
dialog4=Hej h\u00F8vding, vi fandt et interessant kort i ruinerne. Det viser en \u00F8, vi ikke kendte til, s\u00E5 jeg har tegnet den ind p\u00E5 vores kort. M\u00E5ske er det der, Fjorleif gemmer sig?
game_over=Alle allierede blev dr\u00E6bt. Spillet er slut.
name1=Allierede
name2=Vikinger
name3=Vikinger
objective=Udslet vikingerne.\nBeskyt dine allierede.
