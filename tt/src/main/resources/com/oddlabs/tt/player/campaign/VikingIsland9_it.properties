header=Togongolum
description=Stando alle chiacchiere dei nativi, in quest''isola vive un vecchio e saggio capo trib\u00F9. Forse se lo troviamo potr\u00E0 darci qualche informazione utile.
header0=Capo Fjorleif
dialog0=Come sospettavo il loro capo \u00E8 ben protetto. Eliminate questi guerrieri e catturatelo per interrogarlo.
header1=Capo Mozumba
dialog1=Per favore non fatemi del male! Vi dir\u00F2 quello che so.. A sud est da qui, c''\u00E8 un''isola che non \u00E8 segnata sulla vostra mappa. Se riesci a scalare la sua montagna, il grande dio Xarr esaudir\u00E0 un tuo desiderio, naturalmente dovrai chiederglielo gentilmente.
game_over=Il capo nemico \u00E8 stato ucciso. Game over.
name2=Nativi
name3=Mozumba
objective=Annienta i nativi.\nCattura il capo Mozumba.
