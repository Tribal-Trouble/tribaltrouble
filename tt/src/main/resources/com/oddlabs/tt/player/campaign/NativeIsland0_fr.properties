header0=Chef Ngumba
dialog0=Ces maudits Vikings ne s\u2019arr\u00EAteront jamais tant qu\u2019ils n\u2019auront pas vol\u00E9s toutes nos statues sacr\u00E9es... Quoi ? On dirait qu\u2019ils arrivent par-l\u00E0 !
header1=Chef Ngumba
dialog1=Qu\u2019ils soient f\u00E9roces ou non, on n\u2019a aucune chance face \u00E0 eux\u2026 Je ferais mieux de prendre le chemin de derri\u00E8re jusqu\u2019\u00E0 la plage et\u2026 euh\u2026 organiser quelques renforts. Tenez bon, guerrier, je reviens vite !
header2=Chef Ngumba
dialog2=Salut, les gars ! J\u2019aurais vraiment besoin de votre aide en ce moment...
header3=Nufungu le Peu-F\u00E9roce
dialog3=Trop tard, ce Fjorleif a d\u00E9j\u00E0 pill\u00E9 toutes nos statues et pris le large\u2026 Il a m\u00EAme emport\u00E9 quelques chickens tropicaux avec lui ! Mais tout espoir n\u2019est pas perdu : je viens de recevoir des nouvelles, son insens\u00E9 de cousin Gunnar a \u00E9t\u00E9 aper\u00E7u de l\u2019autre c\u00F4t\u00E9 de cette \u00EEle.
header4=Chef Ngumba
dialog4=Pas de temps \u00E0 perdre alors, capturons et interrogeons Gunnar. Si quelqu\u2019un sait o\u00F9 Fjorleif se dirige, c\u2019est bien lui.
header5=Chef Gunnar le cr\u00E9dule
dialog5=Ok, ok, d'accord, je me rends ! Je vous rends vos statues et je rentre chez moi...
header6=Chef Ngumba
dialog6=Ton cousin Fjorleif a d\u00E9j\u00E0 vol\u00E9 les derni\u00E8res, imb\u00E9cile ! Et \u00E0 moins que tu veuilles qu\u2019on te fasse passer par ce cor en laiton, tu vas nous dire o\u00F9 trouver Fjorleif et nos pr\u00E9cieuses statues.
header7=Chef Gunnar le cr\u00E9dule
dialog7=Ouah, pas par le cor ! Je vais vous aider \u00E0 dessiner une carte de nos \u00EEles, d'accord ?
name1=Nouveaux Natifs
name2=Vikings
name3=Natifs
statue=Statue en or
objective0=Repliez-vous sur la plage et trouvez les renforts.
objective1=\u00C9liminez les Vikings.
