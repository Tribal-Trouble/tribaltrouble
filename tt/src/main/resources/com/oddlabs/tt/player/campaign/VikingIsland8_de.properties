header=Lumumgumphe
description=Das Schiff kann das Riff nicht \u00FCberqueren, solange H\u00E4uptling Fjorleif und seine leicht \u00FCbergewichtigen M\u00E4nner an Bord sind. Sie m\u00FCssen die Insel also zu Fu\u00DF \u00FCberqueren, w\u00E4hrend der erste Maat das Schiff durch das Riff navigiert.
header0=H\u00E4uptling Fjorleif
dialog0=Vorsicht, M\u00E4nner! \u00DCberall auf der Insel lauern diese feindseligen Eingeborenen. Wir m\u00FCssen also vorsichtig sein. Unser Ziel ist der Versammlungsort auf der anderen Inselseite.
header1=Versammlungspunkt erreicht
dialog1=+++Sie haben den Versammlungspunkt erreicht. Signalisieren Sie dem Schiff, dass Sie abgeholt werden m\u00F6chten, indem Sie ein Gr\u00E4ssliches Gedudel erklingen lassen.
header2=Steingrim Sch\u00E4delklopfer
dialog2=Seid gegr\u00FC\u00DFt! Unser Schiff ist auf dem Riff zerschellt, wir sitzen hier also schon eine ganze Zeit lang fest. Wir haben uns bisher vor den Eingeborenen in diesem Tal versteckt - wahrscheinlich k\u00F6nnt ihr euch vorstellen, wie froh wir sind, euch zu sehen. Wir kommen gerne mit - wahrscheinlich ist dies unsere einzige Chance, hier wegzukommen.
name1=Gestrandet
name2=Eingeborene
objective0=Schlagen Sie sich bis zum Versammlungsort durch.
objective1=Lassen Sie neben den Versammlungsort ein Gr\u00E4ssliches Gedudel erklingen.
