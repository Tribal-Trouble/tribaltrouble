header=Togongolum
description=Bei den Eingeborenen erz\u00E4hlt man sich, auf der Insel gebe es einen sehr alten und weisen H\u00E4uptling. Vielleicht gibt er ja ein paar n\u00FCtzliche Informationen preis, wenn wir ihn erwischen.
header0=H\u00E4uptling Fjorleif
dialog0=Wie erwartet ist der H\u00E4uptling hervorragend gesch\u00FCtzt. Schalten Sie seine Krieger aus, und setzen Sie ihn f\u00FCr die Befragung fest.
header1=H\u00E4uptling Mozumba
dialog1=Bitte, tut mir nichts! Ich sage alles, was ich wei\u00DF ... Ein ganzes St\u00FCck s\u00FCdwestlich von hier gibt es eine Insel, die auf keiner Karte zu finden ist. Demjenigen, der den Berg darauf bezwingt, gew\u00E4hrt der gro\u00DFe Donnergott Xarr einen Wunsch - vorausgesetzt, man bittet ihn recht nett.
game_over=Der feindliche H\u00E4uptling wurde besiegt. Game over.
name2=Eingeborene
name3=Mozumba
objective=Vernichten Sie die Eingeborenen.\nFangen Sie H\u00E4uptling Mozumba.
