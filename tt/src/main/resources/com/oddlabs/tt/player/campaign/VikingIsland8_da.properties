header=Lumumgumphe
description=Skibet kan ikke krydse revet med H\u00F8vding Fjorleif og hans lettere overv\u00E6gtige m\u00E6nd ombord. De bliver i stedet n\u00F8dt til at krydse \u00F8en til fods, mens styrmanden navigerer skibet gennem revet.
header0=H\u00F8vding Fjorleif
dialog0=V\u00E6r forsigtige! Denne \u00F8 er fyldt med fjendtlige indf\u00F8dte, s\u00E5 vi skal se os for. Vores m\u00E5l er dette samlingspunkt p\u00E5 den anden side af \u00F8en.
header1=Fremme ved samlingspunktet
dialog1=Du er n\u00E5et frem til samlingspunktet. Send et signal til dit skib om, at I skal samles op ved at bl\u00E6se et Terror Trut i din lur.
header2=Steingrim Skallesm\u00E6kker
dialog2=V\u00E6r hilset! Vores skib forliste p\u00E5 revet, s\u00E5 vi har v\u00E6ret strandet her et stykke tid. Vi har undg\u00E5et de indf\u00F8dte ved at gemme os i denne dal, s\u00E5 I er mere end velkomne! Vi vil med gl\u00E6de slutte os til jer, da det nok er vores eneste chance for at slippe ud.
name1=Strandede
name2=Indf\u00F8dte
objective0=N\u00E5 frem til samlingspunktet.
objective1=Bl\u00E6s et Terror Trut i n\u00E6rheden af samlingspunktet.
