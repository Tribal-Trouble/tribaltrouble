header=Guzumbabwe
description=Hemos visto un mont\u00F3n de pollos de colores en esa isla. Quiz\u00E1s los ind\u00EDgenas los est\u00E1n alimentando con alg\u00FAn siniestro prop\u00F3sito.
header0=Jefe Fjorleif
dialog0=Nuestros exploradores nos han informado que los ind\u00EDgenas parecen estar usando esos pollos para construir armas especiales. \u00A1Debemos derrotarles y averiguar su secreto!
header1=Jefe Fjorleif
dialog1=Su secreto era usar los picos de los pollos como puntas de lanza. He dise\u00F1ado un hacha de la misma manera, as\u00ED que ahora podremos equipar terribles Guerreros Pollo.
name2=Ind\u00EDgenas
objective=Destruir a los ind\u00EDgenas.
