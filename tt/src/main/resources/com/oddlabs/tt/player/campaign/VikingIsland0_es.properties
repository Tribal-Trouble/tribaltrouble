header0=Petur el Pe\u00F3n
dialog0=\u00A1Ay madre, qu\u00E9 desastre! No s\u00F3lo volvimos a beber demasiado, sino que una descomunal tormenta nos ha golpeado durante d\u00EDas. Uno s\u00F3lo puede intentar adivinar donde acabaremos. La mitad de la tripulaci\u00F3n ha desaparecido y el Jefe Fjorleif desembarc\u00F3 cerca de esta isla. Creo que ha sido capturado por los ind\u00EDgenas... \u00A1tenemos que liberarlo!
header1=Jefe Fjorleif
dialog1=\u00A1Buen trabajo, chicos! Mientras estaba capturado por los ind\u00EDgenas, consegu\u00ED copiar uno de sus mapas. Creo que tienen alg\u00FAn bot\u00EDn escondido en las islas m\u00E1s grandes. Perdimos todo nuestro bot\u00EDn durante la tormenta, y no quiero ni imaginarme lo que nos har\u00E1n nuestras parientas si volvemos a casa con las manos vac\u00EDas de este viaje. \u00A1As\u00ED que a trabajar!
game_over=El Jefe Fjorleif ha sido asesinado. Fin de la partida.
name1=Fjorleif
name2=Ind\u00EDgenas
objective=Destruye a los ind\u00EDgenas.\nRescata al jefe tribal.
