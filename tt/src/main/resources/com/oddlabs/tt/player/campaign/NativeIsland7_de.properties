header=Reykur\u00F6r\u00E6fi
description=Das muss Fjorleifs geheimes Versteck sein. Zweifellos hat er die Statuen hier versteckt.
header0=H\u00E4uptling Fjorleif
dialog0=So, so ... wen haben wir denn da? Wenn das nicht der ehrenwerte H\u00E4uptling Ngumba ist! Diese h\u00E4sslichen Statuen m\u00FCssen euch ja schon sehr am Herzen liegen, wenn ihr daf\u00FCr den langen Weg in den hohen Norden auf euch genommen habt.
header1=H\u00E4uptling Ngumba
dialog1=Mehr als du glaubst, Fjorleif ... Ich glaube, es ist an der Zeit, dass du lernst, was passieren kann, wenn man anderer Leute Goldstatuen klaut!
name2=Wikinger
statue=Goldstatue
objective=Vernichten Sie Fjorleifs Stamm, und nehmen Sie die Statuen wieder in Besitz.
