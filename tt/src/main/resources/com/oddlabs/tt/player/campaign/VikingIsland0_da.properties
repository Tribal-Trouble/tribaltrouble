header0=Bjarke Bonder\u00F8v
dialog0=\u00C5h nej, hvilken katastrofe! Ikke nok med at vi drak for meget igen. Vi blev ogs\u00E5 ramt af en voldsom tordenstorm, der varede i dagevis. Vi kan kun g\u00E6tte p\u00E5, hvor vi er endt henne. Halvdelen af mandskabet er v\u00E6k, og H\u00F8vding Fjorleif faldt over bord et eller andet sted i n\u00E6rheden af denne \u00F8. Jeg tror, han bliver holdt fanget af de indf\u00F8dte... vi bliver n\u00F8dt til at befri ham!
header1=H\u00F8vding Fjorleif
dialog1=Godt arbejde! Mens jeg blev holdt fanget af de indf\u00F8dte, lykkedes det mig at kopiere et af deres kort. Jeg tror, de har nogle skatte gemt p\u00E5 de st\u00F8rre \u00F8er. Vi mistede vores rov under stormen, og jeg t\u00F8r ikke engang forestille mig, hvad vores koner g\u00F8r ved os, hvis vi kommer tomh\u00E6ndet hjem fra denne rejse. Lad os komme igang!
game_over=H\u00F8vding Fjorleif blev dr\u00E6bt. Spillet er slut.
name1=Fjorleif
name2=Indf\u00F8dte
objective=Udslet de indf\u00F8dte.\nBefri h\u00F8vdingen.
