header0=H\u00E4uptling Ngumba
dialog0=Die verdammten Wikinger werden keine Ruhe geben, bis sie sich jede einzelne unserer heiligen Statuen unter den Nagel gerissen haben. Offenbar kommen sie jetzt von dort!
header1=H\u00E4uptling Ngumba
dialog1=Wild hin oder her. Gegen diese Armee haben wir keine Chance. Ich verkr\u00FCmle mich besser in Richtung Strand und ... \u00E4hhh ... k\u00FCmmere mich um Verst\u00E4rkung. Haltet die Stellung, bis ich wiederkomme!
header2=H\u00E4uptling Ngumba
dialog2=Seid gegr\u00FC\u00DFt, M\u00E4nner! Ich k\u00F6nnte eure Hilfe jetzt wirklich gut gebrauchen.
header3=Nufungu der Nicht-ganz-so-Wilde
dialog3=Zu sp\u00E4t, dieser Fjorleif hat die letzte unserer Statuen geraubt und ist davongesegelt. Er hat sogar ein paar von den Tropenh\u00FChnchen mitgenommen! Aber noch ist nicht alles verloren. Ich habe geh\u00F6rt, dass sein beschr\u00E4nkter Cousin Gunnar auf der anderen Seite dieser Insel gesehen wurde.
header4=H\u00E4uptling Ngumba
dialog4=Wir haben also keine Zeit zu verlieren! Los, diesen Gunnar schnappen wir uns und quetschen ihn aus wie eine Zitrone! Wenn irgendjemand wei\u00DF, wohin Fjorleif unterwegs ist, dann er!
header5=H\u00E4uptling Gunnar der Gutgl\u00E4ubige
dialog5=OK, ich hab''s kapiert, ich ergebe mich! Behaltet eure Statuen, ich segle nach Hause.
header6=H\u00E4uptling Ngumba
dialog6=Dein Cousin Fjorleif hat schon die letzte gestohlen, du Idiot! Und wenn du nicht willst, dass wir dich durch dieses Bronzehorn hier dr\u00FCcken, erz\u00E4hlst du uns besser, wo wir Fjorleif und unsere wertvollen Statuen finden k\u00F6nnen.
header7=H\u00E4uptling Gunnar der Gutgl\u00E4ubige
dialog7=Auuuu, nicht meine Lure! Ich werde euch helfen, eine Karte unserer Inseln zu zeichnen.
name1=Neue Eingeborene
name2=Wikinger
name3=Eingeborene
statue=Goldstatue
objective0=Ziehen Sie sich zum Strand zur\u00FCck, und suchen Sie nach Verst\u00E4rkung.
objective1=Vernichten Sie die Wikinger.
