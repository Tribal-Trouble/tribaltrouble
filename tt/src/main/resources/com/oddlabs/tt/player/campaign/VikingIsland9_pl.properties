header=Togongolum
description=Jak g\u0142osi miejscowa plotka, na tej wyspie mieszka bardzo stary i m\u0105dry w\u00F3dz. By\u0107 mo\u017Ce uda nam si\u0119 uzyska\u0107 od niego jakie\u015B przydatne informacje, je\u015Bli go z\u0142apiemy.
header0=W\u00F3dz Fjorleif
dialog0=Tak jak mo\u017Cna by\u0142o si\u0119 spodziewa\u0107, w\u00F3dz jest dobrze chroniony. Wyeliminuj jego wojownik\u00F3w i pojmijcie go w celu przes\u0142uchania.
header1=W\u00F3dz Mozumba
dialog1=Prosz\u0119, nie r\u00F3b mi krzywdy! Powiem ci wszystko, co wiem\u2026 Daleko na po\u0142udniowy wsch\u00F3d st\u0105d znajduje si\u0119 wyspa, kt\u00F3rej nie znajdziesz na swojej mapie. Je\u015Bli uda ci si\u0119 wspi\u0105\u0107 na jej szczyt, wielki b\u00F3g piorun\u00F3w Xarrr spe\u0142ni twoje \u017Cyczenie, oczywi\u015Bcie pod warunkiem, \u017Ce go grzecznie poprosisz.
game_over=Wrogi w\u00F3dz zosta\u0142 zabity. Koniec gry.
