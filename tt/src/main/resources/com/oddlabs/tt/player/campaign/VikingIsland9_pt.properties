header=Togongolum
description=De acordo com a fofoca ind\u00EDgena, essa ilha hospeda um chefe bem velho e s\u00E1bio. Talvez ele pode compartilhar alguma informa\u00E7\u00E3o se n\u00F3s o pegarmos.
header0=Chefe Fjorleif
dialog0=Como esperado, o chefe est\u00E1 bem protegido. Elimine seus guerreiros e capture-o pra interroga\u00E7\u00E3o.
header1=Chefe Mozumba
dialog1=Por favor n\u00E3o me machuque! Eu vou te contar o que eu sei.. Bem ao sudeste daqui, h\u00E1 uma ilha que voc\u00EA n\u00E3o vai encontrar em seu mapa. se voc\u00EA conseguir escalar sua montanha, o grande deus do trov\u00E3o Xarrr vai te conceder um desejo, se voc\u00EA pedir pra ele de forma gentil, claro.
game_over=Chefe inimigo foi morto. Fim de jogo.
name2=Ind\u00EDgenas
name3=Mozumba
objective=Destrua os ind\u00EDgenas.\nCapture o chefe Mozumba.
