description=Wyspa Gunnara. Powiedzia\u0142 nam, \u017Ce niekt\u00F3rzy z naszych ludzi zostali pojmani i wzi\u0119ci w niewol\u0119, wi\u0119c by\u0107 mo\u017Ce cz\u0119\u015B\u0107 z nich trafi\u0142a w\u0142a\u015Bnie tutaj. Je\u015Bli tak, musimy ich natychmiast uwolni\u0107!
header0=Zimfubo Gorliwy
dialog0=Sp\u00F3jrz, wodzu! Gunnar mia\u0142 racj\u0119, zabrali ze sob\u0105 cz\u0119\u015B\u0107 naszych ludzi, zapewne po to, by uczyni\u0107 z nich niewolnik\u00F3w. Poka\u017C im sw\u00F3j gniew i uwolnij moc Trzeszcz\u0105cej Chmury!
header1=W\u00F3dz Ngumba
dialog1=Cholera! Nie udaje mi si\u0119 tego uruchomi\u0107 w tak zimnym klimacie. A mo\u017Ce po prostu jeste\u015Bmy zbyt daleko od kr\u00F3lestwa Wielkiego Xarrra. Wygl\u0105da na to, \u017Ce b\u0119dziemy musieli zrobi\u0107 to po staremu\u2026 do dzie\u0142a!
header2=W\u00F3dz Ngumba
dialog2=Jeste\u015Bcie ju\u017C wolni, mali towarzysze, koniec z har\u00F3wk\u0105 dla Wiking\u00F3w!\n\nNo ju\u017C, nie st\u00F3jcie tak bezczynnie \u2013 do roboty! Zbudujcie mi wiosk\u0119, \u017Ceby\u015Bmy mogli zebra\u0107 pot\u0119\u017Cn\u0105 armi\u0119 i pokona\u0107 tych Wiking\u00F3w!
