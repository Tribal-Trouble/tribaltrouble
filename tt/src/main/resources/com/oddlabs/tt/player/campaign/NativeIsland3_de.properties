header=Dyngjaskagi
description=Gunnar sagte was \u00FCber einen gro\u00DFen und allm\u00E4chtigen Donnergott, der sich irgendwo auf dieser Insel herumtreiben soll. Naja, so stark wie der M\u00E4chtige Xarrr wird er sicherlich nicht sein, aber vielleicht kann er uns doch ein wenig aushelfen, jetzt, da uns die Wummernde Wolke im Stich gelassen hat.
header0=H\u00E4uptling Ngumba
dialog0=Wir sind am Ziel - Zeit f\u00FCr ein kleines Picknick. Wir sollten uns aber beeilen, ich glaube, die Wikinger sind auch schon unterwegs. Oh, und haltet euch von den T\u00FCrmen fern.
header1=Thor
dialog1=Wer wagt es, in mein Reich einzudringen?!?
header2=H\u00E4uptling Ngumba
dialog2=H\u00E4uptling Ngumba und seine furchtlosen Krieger!
header3=Thor
dialog3=Ihr impertinenten Zwerge! Das werdet ihr bereuen!
header4=H\u00E4uptling Ngumba
dialog4=Ahhhh, Gro\u00DFer Xarrr, besch\u00FCtze uns!
header5=Thor
dialog5=Xarrr? Den kennt ihr? Das ist mein alter Kumpel von der G\u00F6tterakademie! Netter Kerl!
header6=H\u00E4uptling Ngumba
dialog6=\u00C4hm, klar kennen wir den! Er hat mir beigebracht, das Wetter zu beeinflussen, so dass ich meine Feinde mit heftigen Blitzen niederstrecken kann. Aber irgendwie funktioniert das in diesem kalten Klima nicht.
header7=Thor
dialog7=Dann hat er dir bestimmt auch beigebracht, wie man den vorz\u00FCglichen Ekligen Eintopf macht, den er fr\u00FCher immer gekocht hat. Ich liebe exotische Speisen, aber meine Frau setzt mir immer dieselben langweiligen Blut- und Leberw\u00FCrste vor. Koch mir diesen Eintopf, dann helfe ich euch mit eurem Blitzproblem!
header8=H\u00E4uptling Ngumba
dialog8=Kein Problem, Thor, deinen Ekligen Eintopf sollst du haben!
name2=Wachen
name4=Wikinger
god=Thor
objective0=Gehen Sie zu Thor.
objective1=Kochen Sie Ekligen Eintopf f\u00FCr Thor.
