header=Var\u00F0ask\u00F3gur
description=Peut-\u00EAtre que c\u2019est l\u2019\u00EEle secr\u00E8te dont Grimhildur le Goinfre parlait, quand il a dit que Fjorleif avait pris le large vers l\u2019ouest avec les statues.
header0=Chef Ngumba
dialog0=Mort et diarrh\u00E9e, pas de statues ici non plus ! Au moins, il semble que certains des n\u00F4tres aient install\u00E9 un camp un peu plus loin sur la c\u00F4te.
header1=Chef Gotoba
dialog1=Salut, chef Ngumba ! Nous sommes un groupe d\u2019anciens esclaves qui avons r\u00E9ussi \u00E0 nous \u00E9chapper. Gr\u00E2ce \u00E0 la taille \u00E9norme de cette \u00EEle, nous avons pu nous cacher des Vikings. Nous installons un camp ici pour construire un navire et rentrer chez nous.
header2=Chef Ngumba
dialog2=Et si on faisait \u00E9quipe pour chasser les Vikings de cette \u00EEle ? Sans eux pour nous g\u00EAner, ton chantier naval sera bien plus facile.
header3=Chef Gotoba
dialog3=\u00C7a pourrait marcher\u2026 Allez, il est temps de botter le derri\u00E8re des Vikings !
header4=Ngolongo le Leste
dialog4=Chef, nous avons trouv\u00E9 une carte int\u00E9ressante dans les ruines. Elle montre une \u00EEle que nous ne connaissions pas, alors je l\u2019ai dessin\u00E9e sur notre carte. Peut-\u00EAtre que c\u2019est l\u00E0 que Fjorleif se cache ?
game_over=Tous les alli\u00E9s ont \u00E9t\u00E9 tu\u00E9s. Partie termin\u00E9e.
name1=Alli\u00E9s
name2=Vikings
name3=Vikings
objective=\u00C9liminez les Vikings.\nProt\u00E9gez vos alli\u00E9s.
