header0=H\u00F8vding Ngumba
dialog0=De forbandede vikinger stopper ikke, f\u00F8r de har hver eneste af vores hellige statuer. Det ser ud til de kommer denne vej nu!
header1=H\u00F8vding Ngumba
dialog1=Frygtindgydende eller ej, s\u00E5 tror jeg ikke p\u00E5, vi har en chance mod den h\u00E6r. Jeg m\u00E5 hellere smutte ad bagvejen ned til stranden og ... \u00F8h ... skaffe nogle forst\u00E6rkninger. Hold ud mens jeg er v\u00E6k!
header2=H\u00F8vding Ngumba
dialog2=V\u00E6r hilset! Jeg kunne virkelig godt bruge jeres hj\u00E6lp nu.
header3=Bufungu Bangebuks
dialog3=For sent, den Fjorleif gut har allerede stj\u00E5let resten af vores statuer og er sejlet bort. Han tog endda nogle tropekyllinger med sig! Vi har dog ikke tabt alt h\u00E5b. Jeg har lige h\u00F8rt, at hans \u00E5ndsvage f\u00E6tter Gunnar er blevet set p\u00E5 den anden side af \u00F8en.
header4=H\u00F8vding Ngumba
dialog4=S\u00E5 er der ingen tid at spilde. Lad os fange og afh\u00F8re Gunnar. Hvis nogen ved, hvor Fjorleif tager hen, s\u00E5 er det ham.
header5=H\u00F8vding Gunnar den Godtroende
dialog5=OK, jeg har fattet beskeden, jeg overgiver mig! Jeg skal nok lade jeres statuer v\u00E6re i fred og sejle hjem.
header6=H\u00F8vding Ngumba
dialog6=Din f\u00E6tter Fjorleif har allerede stj\u00E5let de sidste af dem, dit fjols! Og med mindre du ikke vil have os til at presse dig gennem dit messinghorn, s\u00E5 fort\u00E6ller du os, hvor vi kan finde Fjorleif og vores kostbare statuer.
header7=H\u00F8vding Gunnar den Godtroende
dialog7=Aaavv, ikke min lur! Jeg skal nok hj\u00E6lpe dig med at tegne et kort over vores \u00F8er.
name1=Hj\u00E6lpere
name2=Vikinger
name3=Indf\u00F8dte
statue=Guldstatue
objective0=Tr\u00E6k dig tilbage til stranden og find nogle forst\u00E6rkninger.
objective1=Udslet vikingerne.
