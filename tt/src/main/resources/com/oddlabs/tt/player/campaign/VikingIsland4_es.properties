header=Gobazumbi
description=Los restos de un barco Vikingo han sido visto en aguas cercanas a esta isla. Quiz\u00E1 hay otros valientes Vikingos que han sufrido el mismo destino que nosotros.
header0=Jefe Fjorleif
dialog0=El naufragio result\u00F3 ser de mi primo Gunnar el Gazn\u00E1piro, quien ahora est\u00E1 siendo retenido por los ind\u00EDgenas. \u00A1Vamos a liberarle!
header1=Jefe Gunnar
dialog1=\u00A1Gracias por liberarme! Quiz\u00E1s deber\u00EDa haber escuchado a mis hombres, pero estaba seguro que los ind\u00EDgenas iban a invitarnos a cenar... Creo que todav\u00EDa tengo que mejorar mi habilidad con el lur un poco. D\u00E9jame ense\u00F1arte como toco el Lur Liante, con el que se atontan los enemigos durante un rato.
game_over=Jefe Gunnar ha sido asesinado. Fin de la partida.
name1=Gunnar
name2=Ind\u00EDgenas
objective=Destruir a los ind\u00EDgenas.\nLiberar a Gunnar.
