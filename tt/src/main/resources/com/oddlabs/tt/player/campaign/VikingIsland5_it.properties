header=Gutshumdi
description=Tuo cugino, Gunnar L''Ingenuo, sta cercando di conquistare quest''isola, ma gli farebbe comodo un po'' di aiuto per distruggere l''accampamento nemico. Se lo aiuti, Gunnar potrebbe lasciarti alcuni dei suoi uomini.
header0=Chief Fjorleif
dialog0=Ok, inceneriamo quelle capanne! Mi raccomando, proteggete i nostri alleati.
header1=Capo Gunnar
dialog1=Non posso crederci, i nativi si stanno prendendo gioco di noi! Se ci aiutate a sconfiggerli vi ricompenser\u00F2.
header2=Capo Gunnar
dialog2=Grazie per l''aiuto! Mander\u00F2 5 dei miei migliori uomini per aiutarti nella tua ricerca.
game_over=La trib\u00F9 di Gunnar \u00E8 stata eliminata. Game over.
