header=J\u00F6kullhnj\u00FAkur
description=Vikingernes frygtede f\u00E6ngsels\u00F8, hvor de holder de mest besv\u00E6rlige fanger.
header0=Fufubi Fumlefjols
dialog0=V\u00E6r hilset h\u00F8vding, vi vidste du ville komme og redde os! Det lykkedes os at flygte fra f\u00E6ngselslejren, men vi har gemt os her i dagevis uden mad og vand... Jeg er bange for, at vi er i temmelig ussel stand, s\u00E5 vi kan ikke hj\u00E6lpe dig med at sl\u00E5s mod vikingerne.
header1=H\u00F8vding Ngumba
dialog1=Det skal du ikke bekymre dig om, vi skal nok beskytte dig, men vi har et lille problem. Vores skib ramte et rev p\u00E5 vej herop og tager vand ind, s\u00E5 vi bliver n\u00F8dt til at reparere det. Vi skal bare holde stand i et lille stykke tid, s\u00E5 kan vi sejle fra \u00F8en og tage jer med os.
game_over=Alle fanger blev dr\u00E6bt. Spillet er slut.
name1=Fanger
name2=Vikinger
