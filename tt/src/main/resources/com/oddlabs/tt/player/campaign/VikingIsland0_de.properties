header0=Knut der Knecht
dialog0=Was f\u00FCr ein Chaos! Nicht nur, dass wir wieder mal zu viel gebechert haben, nein, wir sind auch noch in ein schreckliches Unwetter geraten, das mehrere Tage gedauert hat. Wir k\u00F6nnen nur raten, wo wir eigentlich gelandet sind. Die H\u00E4lfte der Crew fehlt, und H\u00E4uptling Fjorleif ist irgendwo in der N\u00E4he dieser Insel \u00FCber Bord gegangen. Ich denke, er wird von den Eingeborenen gefangen gehalten ... wir m\u00FCssen ihn befreien!
header1=H\u00E4uptling Fjorleif
dialog1=Gute Arbeit, M\u00E4nner! W\u00E4hrend ich von diesen Wilden gefangen gehalten wurde, konnte ich einige ihrer Karten abzeichnen. Ich glaube, irgendwo auf einer dieser gr\u00F6\u00DFeren Inseln haben die einen Schatz versteckt. Wir haben unsere gesamte Beute im Sturm verloren, und ich mag gar nicht daran denken, was unsere Frauen uns antun w\u00FCrden, wenn wir mit leeren H\u00E4nden von dieser Reise zur\u00FCckk\u00E4men. Machen wir uns also an die Arbeit!
game_over=H\u00E4uptling Fjorleif wurde get\u00F6tet. Game over.
name1=Fjorleif
name2=Eingeborene
objective=Vernichten Sie die Eingeborenen.\nBefreien Sie den H\u00E4uptling.
