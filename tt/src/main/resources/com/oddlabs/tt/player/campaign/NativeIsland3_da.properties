header=Dyngjaskagi
description=Gunnar n\u00E6vnte noget om en stor og m\u00E6gtig tordengud, der skulle holde til p\u00E5 denne \u00F8. Der er ingen chance for, at han er bare halvt s\u00E5 kraftfuld som den m\u00E6gtige Xarrr, men han kunne m\u00E5ske hj\u00E6lpe med den fejlende Tossede Tordensky.
header0=H\u00F8vding Ngumba
dialog0=Dette er vores destination - tid til en lille skovtur. Vi m\u00E5 dog hellere skynde os, jeg tror ogs\u00E5, vikingerne er p\u00E5 vej. Og pas i \u00F8vrigt lige p\u00E5 med at komme for t\u00E6t p\u00E5 t\u00E5rnene.
header1=Thor
dialog1=Hvem vover at betr\u00E6de min halv\u00F8?!?
header2=H\u00F8vding Ngumba
dialog2=H\u00F8vding Ngumba og hans frygtl\u00F8se krigere!
header3=Thor
dialog3=Din n\u00E6svise lille mide! Det kommer du til at fortryde!
header4=H\u00F8vding Ngumba
dialog4=*hvin* Store Xarrr, beskyt os!
header5=Thor
dialog5=Xarrr? Kender du ham? Han er en af mine gamle venner fra gudeakademiet. Venlig fyr!
header6=H\u00F8vding Ngumba
dialog6=\u00D8hm, ja. Han l\u00E6rte mig at styre vejret, s\u00E5 jeg kunne sl\u00E5 ned p\u00E5 mine fjender med lyn og torden. Det ser dog ikke ud til at virke i dette kolde klima.
header7=Thor
dialog7=S\u00E5 m\u00E5 han ogs\u00E5 have l\u00E6rt dig at lave den l\u00E6kre Stinkende Stuvning, han plejede at lave til mig i de gode gamle dage. Jeg elsker eksotisk mad, men min kone serverer altid det samme kedelige fars og blodp\u00F8lse. Lav mig noget stuvning, og jeg vil s\u00E5 hj\u00E6lpe dig med dit tordenproblem!
header8=H\u00F8vding Ngumba
dialog8=OK Thor, jeg laver en portion Stinkende Stuvning til dig!
name2=Vagter
name4=Vikinger
god=Thor
objective0=G\u00E5 hen til Thor.
objective1=Lav en Stinkende Stuvning til Thor.
