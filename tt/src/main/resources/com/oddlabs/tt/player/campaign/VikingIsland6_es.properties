header=Kosobimba
description=Por razones desconocidas, algunos peones fueron abandonadas en esta isla. Vamos a ver si les podemos ayudar.
header0=Jefe Fjorleif
dialog0=No te preocupes, \u00A1les vamos a dar una lecci\u00F3n a esos nativos! Despues, puedes unirte a nosotros.
header1=Nulfr el No-me-lavo
dialog1=\u00A1Maldito Jefe Gunnar y sus est\u00FApidas ideas! Nos pidi\u00F3 que saque\u00E1ramos esta isla mientras \u00E9l visitaba otra, pero nos dej\u00F3 aqu\u00ED sin armas y en clara inferioridad num\u00E9rica con los ind\u00EDgenas. Si nos ayudas, \u00A1creo que mejor nos pasaremos a tu tribu!
game_over=Todos los aliados han sido asesinados. Fin de la partida.
new_units_header=Jefe Fjorleif
new_units=\u00A1Hurraaa! {0} de los hombres de Gunnar se nos han unido.
