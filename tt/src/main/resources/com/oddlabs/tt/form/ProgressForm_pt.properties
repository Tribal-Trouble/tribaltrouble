tip0=Atacar unidades inimigas de um terreno mais elevado vai dar aos seus guerreiros uma vantagem t\u00E1tica
tip1=Guarde uma sele\u00E7\u00E3o pressionando Ctrl + 0-9 e reselecione ela ao pressionar seu n\u00FAmero
tip2=D\u00EA um zoom para a sele\u00E7\u00E3o guardada ao apertar duas vezes o seu n\u00FAmero designado
tip3=Selecione todas as unidades do mesmo tipo dentro da vis\u00E3o dando um clique duplo em uma delas
tip4=Aproxime e afaste a c\u00E2mera ao rodar a roda do mouse ou usando Page Up e Page Down
tip5=Quanto mais unidades voc\u00EA tiver em uma armaria, mais r\u00E1pido elas conseguem produzir armas
tip6=Quando atribuindo unidades, d\u00EA um clique direito no icone de + e - para alterar os n\u00FAmeros para 10 por vez.
tip7=Mova as unidades selecionadas para dentro de um edif\u00EDcio ao dar um clique direito no edif\u00EDcio.
tip8=Quanto mais unidades voc\u00EA tiver em um alojamento, mais r\u00E1pido ele vai produzir mais pe\u00F5es
tip9=Quanto mais unidades voc\u00EA tiver em um alojamento, mais r\u00E1pido ele vai produzir um chefe
tip10=Pe\u00F5es podem derrubar torres mais r\u00E1pido que guerreiros
tip11=Mover unidades usando o comando de ataque no ch\u00E3o vai fazer com que elas ataquem unidades inimigas \u00E0 vista
tip12=Pressione Espa\u00E7o ou 5 no teclado num\u00E9rico para entrar no Modo Mapa
tip13=Posicione o ponteiro do mouse sobre unidades e edif\u00EDcios para monitorar seus status
tip14=Unidades e edif\u00EDcios de membros de equipe s\u00E3o marcados com circulos azuis quando selecionados
tip15=Fa\u00E7a uma panor\u00E2mica pelo mapa ao mover o ponteiro do mouse para a ponta da tela ou ao usar as setas do teclado
tip16=Rotacione a vis\u00E3o usando 4 e 6 no teclado num\u00E9rico ou Insert e Delete
tip17=Direcione onde suas unidades devem se agrupar quando sairem de um edif\u00EDcio usando um ponto de encontro
tip18=Olhe para cima e para baixo usando 2 e 8 no teclado num\u00E9rico ou Home e End
tip19=Armas feitas da galinha tropical conseguem quicar e acertar v\u00E1rios inimigos
tip20=No Modo Mapa, suas unidades e edif\u00EDcios s\u00E3o marcados com a sua cor de jogador
tip21=D\u00EA um zoom em outra area da ilha rapidamente trocando pelo Modo Mapa e clicando em algum lugar do mapa
tip22=Selecione multiplas unidades segurando o shift enquanto clica em mais unidades
tip23=Selecione multiplas unidades arrastando uma caixa ao redor das unidades que voc\u00EA quer selecionar
tip24=Para construir novos edif\u00EDcios rapidamente, utilize a fun\u00E7\u00E3o de transporte para enviar um grupo de pe\u00F5es carregados com madeira
tip25=As torres servem muito bem para defender constru\u00E7\u00F5es, pe\u00F5es ou passagens estreitas
tip26=Construa alojamentos extras para ganhar novos pe\u00F5es mais rapidamente
tip27=Construir armarias perto de recursos valiosos vai permitir com que os pe\u00F5es peguem os recursos muito mais r\u00E1pido
tip28=Para continuar produzindo um tipo de arma indefinidamente, aumente a produ\u00E7\u00E3o at\u00E9 que um s\u00EDmbolo de infinito apare\u00E7a
tip29=Mude a velocidade da partida pressionando + ou - no teclado num\u00E9rico
tip30=Dentro de uma partida, pressione Enter para enviar mensagens para todos os jogadores e Shift + Enter para apenas os membros de equipe
tip31=Quando uma seta vermelha, verde ou azul piscarem, pressione Tab para pular para a \u00E1rea de interesse
tip32=Quando unidades forem atordoadas pelo Toque Aterrorizante, elas ser\u00E3o mais f\u00E1ceis de atingir
tip33=O Rugido Devastador inflinge mais dano \u00E0 dist\u00E2ncias pr\u00F3ximas
tip34=Uma unidade fica sendo ferida pelo Ensopado Fedorento enquanto ela \u00E9 engolida pela sua fuma\u00E7a
tip35=Unidades aliadas est\u00E3o acostumadas com o Ensopado Fedorento, ent\u00E3o elas s\u00E3o mais resistentes
tip36=A N\u00FAvem Crepitante pode ser usada para ferir inimigos escondidos dentro de acampamentos fortificados
tip37=Utilize Ctrl + B e clique no ch\u00E3o para colocar uma marca\u00E7\u00E3o que alerta sua equipe
tip38=Precione N para alternar entre os pe\u00F5es ociosos
