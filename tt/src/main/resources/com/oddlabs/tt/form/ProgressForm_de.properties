tip0=Angriffe gegen feindliche Stellungen von h\u00F6her gelegenem Terrain aus verschaffen Ihren Kriegern einen taktischen Vorsprung.
tip1=Speichern Sie eine Markierung, indem Sie STRG + 0-9 dr\u00FCcken, und aktivieren Sie sie erneut, indem Sie die entsprechende Zahl dr\u00FCcken.
tip2=Sie k\u00F6nnen auf eine gespeicherte Markierung einzoomen, indem Sie die entsprechende Zahl zwei Mal dr\u00FCcken.
tip3=Durch Doppelklicken auf eine Einheit k\u00F6nnen Sie alle Einheiten desselben Typs in Sichtweite markieren.
tip4=Zum Ein- und Auszoomen verwenden Sie das Mausrad oder die BILD-AB- bzw. BILD-AUF-TASTE.
tip5=Je mehr Einheiten zu einem Zeughaus geh\u00F6ren, desto schneller k\u00F6nnen sie Waffen herstellen.
tip6=Klicken Sie beim Zuweisen der Einheiten mit der rechten Maustaste auf die Symbole ''+'' oder ''-'', um die Zahl um jeweils 10 zu \u00E4ndern.
tip7=Verschieben Sie die ausgew\u00E4hlten Einheiten in ein Geb\u00E4ude, indem Sie mit der rechten Maustaste auf das Geb\u00E4ude klicken.
tip8=Je mehr Einheiten zu einem Quartier geh\u00F6ren, desto schneller werden Knechte produziert.
tip9=Je mehr Einheiten zu einem Quartier geh\u00F6ren, desto schneller wird ein H\u00E4uptling produziert.
tip10=Knechte k\u00F6nnen T\u00FCrme schneller einrei\u00DFen als Krieger.
tip11=Wenn Sie Einheiten bewegen, indem Sie am Boden einen Angriff durchf\u00FChren, greifen sie alle feindlichen Einheiten in Sichtweite an.
tip12=Dr\u00FCcken Sie die LEERTASTE oder die 5 auf dem Ziffernblock, um den Kartenmodus aufzurufen.
tip13=Bewegen Sie den Mauszeiger \u00FCber die Einheiten und Geb\u00E4ude, um ihren Status anzuzeigen.
tip14=Einheiten und Geb\u00E4ude von Teammitgliedern werden mit blauen Kreisen angezeigt, wenn sie markiert wurden.
tip15=Navigieren Sie in der Karte, indem Sie den Mauszeiger zum Bildschirmrand bewegen oder die Pfeiltasten verwenden.
tip16=Zum Drehen der Ansicht verwenden Sie die Ziffern 4 und 6 auf dem Ziffernblock oder die EINFG- und ENTF-TASTE.
tip17=Legen Sie einen Versammlungsort fest, um zu bestimmen, wo sich die Einheiten zusammenfinden sollen, wenn sie ein Geb\u00E4ude verlassen.
tip18=Mit den Ziffern 2 und 8 auf dem Ziffernblock oder mit der POS1- und ENDE-TASTE k\u00F6nnen Sie nach oben oder unten blicken.
tip19=Waffen, die aus Tropenh\u00FChnchen hergestellt werden, k\u00F6nnen abprallen und mehrere Feinde treffen.
tip20=Im Kartenmodus werden Ihre Einheiten und Geb\u00E4ude mit Ihrer Spielerfarbe markiert.
tip21=Um schnell auf einen anderen Bereich der Insel einzuzoomen, wechseln Sie in den Kartenmodus und klicken auf einen beliebigen Ort auf der Karte.
tip22=Zum gleichzeitigen Markieren mehrerer Einheiten halten Sie die UMSCHALTTASTE gedr\u00FCckt, w\u00E4hrend Sie auf die Einheiten klicken.
tip23=Zum Markieren mehrerer Einheiten ziehen Sie ein Rechteck um die zu markierenden Einheiten.
tip24=Zum schnellen Errichten neuer Geb\u00E4ude verwenden Sie die Transportfunktion, um eine Gruppe von holzbeladenen Knechten loszusenden.
tip25=Die T\u00FCrme eignen sich bestens zur Verteidigung von Geb\u00E4uden, Knechten und engen Passagen.
tip26=Bauen Sie ein zus\u00E4tzliches Quartier, um schnell neue Knechte zu gewinnen.
tip27=Wenn Zeugh\u00E4user in der N\u00E4he von n\u00FCtzlichen Ressourcen gebaut werden, k\u00F6nnen die Knechte diese viel schneller zusammentragen.
tip28=Um eine Waffenart unbegrenzt zu produzieren, steigern Sie die Produktion, bis ein Unendlichkeitssymbol angezeigt wird.
tip29=Die Spielgeschwindigkeit \u00E4ndern Sie, indem Sie auf dem Ziffernblock + oder - dr\u00FCcken.
tip30=W\u00E4hrend des Spiels k\u00F6nnen Sie allen Spielern eine Nachricht senden, indem Sie die EINGABETASTE dr\u00FCcken. Durch Dr\u00FCcken der EINGABE- und der UMSCHALTTASTE k\u00F6nnen Sie Ihren Teammitgliedern eine Nachricht senden.
tip31=Wenn ein roter, gr\u00FCner oder blauer Pfeil aufleuchtet, dr\u00FCcken Sie die TAB-TASTE, um zum betreffenden Gebiet zu wechseln.
tip32=Wenn Einheiten vom Gr\u00E4sslichen Gedudel bet\u00E4ubt wurden, sind sie einfacher zu schlagen.
tip33=Der Destruktive Donner richtet bei geringer Distanz mehr Schaden an.
tip34=Eine Einheit wird vom Ekligen Eintopf beeintr\u00E4chtigt, solange sie von seinen D\u00E4mpfen umh\u00FCllt ist.
tip35=Verb\u00FCndete Einheiten sind an den Ekligen Eintopf gew\u00F6hnt, sie sind also resistenter gegen seine Ger\u00FCche.
tip36=Die Wummernde Wolke kann Feinde vernichten, die sich in befestigten Camps verstecken.
tip37=Dr\u00FCcken Sie STRG + B, und klicken Sie auf den Boden, um ein Leuchtsignal zu setzen, das Ihr Team alarmiert.
tip38=Dr\u00FCcken Sie N um einzelne Knechte auszuw\u00E4hlen.
