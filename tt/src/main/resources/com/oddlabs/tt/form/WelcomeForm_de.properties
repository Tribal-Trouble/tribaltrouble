welcome_caption=Willkommen bei Tribal Trouble
welcome_message=Danke, dass Sie Tribal Trouble downgeloadet haben!\n\nWenn Sie einen Registrierungscode haben, klicken Sie auf ''Registrieren'', um die Vollversion von Tribal Trouble zu erhalten.\n\nAndernfalls k\u00F6nnen Sie diese Demoversion beliebig lange verwenden, allerdings stehen dann nicht alle Features zur Verf\u00FCgung.\n\nDenken Sie daran, das Spiel zu aktualisieren, um die aktuellen Features und Bugfixes zu erhalten. Klicken Sie auf ''Jetzt aktualisieren'', oder w\u00E4hlen Sie die Option ''Aktualisieren'' im Hauptmen\u00FC.
update_now=Jetzt aktualisieren
register=Registrieren
