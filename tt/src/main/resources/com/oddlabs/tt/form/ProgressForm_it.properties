tip0=Attaccare le unit\u00E0 nemiche da un punto pi\u00F9 alto da ai tuoi guerrieri un vantaggio tattico
tip1=Salva una selezione premendo Ctrl + 0-9 e riselezionala premendo il numero assegnato
tip2=Zuma ad una selezione salvata premendo due volte il numero che le hai assegnato
tip3=Seleziona tutte le unit\u00E0 dello stesso tipo all''interno della vista cliccando due volte su una di loro
tip4=Zuma muovendo la rotellina del mouse o premendo Pagina Su e Pagina Gi\u00F9
tip5=Pi\u00F9 unit\u00E0 hai nell''armeria e pi\u00F9 velocemente produrranno armi
tip6=Quando assegni le unit\u00E0 fai un click destro del mouse su + e - per incrementarle di 10 alla volta
tip7=Muovi le unit\u00E0 selezionate all''interno di un edificio con un click destro sull''edificio
tip8=Pi\u00F9 unit\u00E0 hai nel Casone pi\u00F9 velocemente produrranno peoni
tip9=Pi\u00F9 unit\u00E0 hai nel Casone pi\u00F9 velocemente produrranno un capo trib\u00F9
tip10=I peoni abbattono le torri pi\u00F9 velocemente dei guerrieri
tip11=Muovendo le unit\u00E0 cliccando attacca sul terreno li far\u00E0 attaccare i nemici a vista
tip12=Premi Spazio o 5 nel tastierino numerico per entrare nel Modo Mappa
tip13=Passa il mouse sopra le unit\u00E0 e gli edifici per monitorare il loro stato
tip14=Le unit\u00E0 e gli edifici del team sono contrassegnati da un cerchio blu quando li selezioni
tip15=Muoviti all''interno della mappa spostando il mouse agli angoli dello schermo o usando le frecce di navigazione
tip16=Ruota la vista usando 4 e 6 del tastierino numerico o Ins e Canc
tip17=Decidi dove le tue unit\u00E0 devono riunirsi quando lasciano un edificio impostando un Luogo di raduno
tip18=Guarda su e gi\u00F9 usando 2 e 8 del tastierino numerico o Home e Fine
tip19=Le armi costruite con i polli tropicali possono rimbalzare e colpire pi\u00F9 nemici
tip20=Nel Modo Mappa, le tue unit\u00E0 ed edifici sono evidenziati con il tuo colore
tip21=Zuma rapidamente ad un''altra area dell''isola attivando il Modo Mappa e cliccando su un punto
tip22=Seleziona pi\u00F9 unit\u00E0 tenendo premuto il tasto shift mentre clicchi su di loro
tip23=Seleziona pi\u00F9 unit\u00E0 tracciando un quadrato attorno alle unit\u00E0 da selezionare
tip24=Per costruire nuovi edifici velocemente usa la funzione Trasporta per far uscire un gruppo di peoni carichi di legno
tip25=Le torri sono ottime per difendere gli edifici, i peoni o passaggi stretti
tip26=Costruisci nuovi casoni per creare nuovi peoni pi\u00F9 rapidamente
tip27=Costruire le armerie vicino alle risorse permette ai peoni di raccoglierle pi\u00F9 rapidamente 
tip28=Per produrre un tipo di arma continuamente aumenta la produzione fino al simbolo di infinito
tip29=Cambia la velocit\u00E0 del gioco premendo + o - sul tastierino numerico
tip30=Mentre giochi, premi Enter per messaggiare con tutti i giocatori o Shift + Enter per messaggiare con il tuo team
tip31=Quando una freccia rossa, verde o blu lampeggia, premi Tab per andare all''area di interesse
tip32=Quando le unit\u00E0 sono state stordite dal Boato Terrificante sono facili da colpire
tip33=Il Ruggito Devastante infligge pi\u00F9 danni a corto raggio
tip34=Una unit\u00E0 rimane avvelenata dallo Stufato Nauseante se ne inala i fumi
tip35=Le unit\u00E0 alleate sono abituate allo Stufato Nauseante per potervi resistere di pi\u00F9
tip36=La Nuvola Crepitante pu\u00F2 essere usata per danneggiare i nemici nascosti in campi fortificati
tip37=Usa Ctrl + B e clicca sul terreno per accendere un faro che allerta il tuo team
tip38=Premi N per passare da un peone all''altro
