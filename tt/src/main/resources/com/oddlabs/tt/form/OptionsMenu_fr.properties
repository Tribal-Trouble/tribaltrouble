report_bug_text=Si vous pensez avoir rencontr\u00E9 une erreur dans Tribal Trouble, utilisez cette fonctionnalit\u00E9 pour la signaler \u00E0 Oddlabs. Veuillez noter qu\u2019en envoyant un rapport de bug, un journal contenant toutes vos actions au clavier et \u00E0 la souris de la session de jeu en cours, ainsi que des informations sur les pilotes de votre carte graphique et sur votre syst\u00E8me d\u2019exploitation, sera transmis \u00E0 Oddlabs en m\u00EAme temps que votre description du probl\u00E8me. Ces informations nous permettent de corriger plus facilement les erreurs du jeu.
