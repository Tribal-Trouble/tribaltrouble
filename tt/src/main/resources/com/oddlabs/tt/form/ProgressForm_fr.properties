tip0=Attaquer des unit\u00E9s ennemies depuis une position en hauteur donnera \u00E0 vos guerriers un avantage tactique.
tip1=Enregistrez une s\u00E9lection avec Ctrl + 0\u20139 et rappelez-la en appuyant sur son num\u00E9ro.
tip2=Zoomez sur une s\u00E9lection enregistr\u00E9e en appuyant deux fois sur son num\u00E9ro.
tip3=S\u00E9lectionnez toutes les unit\u00E9s du m\u00EAme type visibles en double-cliquant sur l\u2019une d\u2019elles.
tip4=Zoomez en avant ou en arri\u00E8re avec la molette de la souris ou avec les touches Page Up et Page Down.
tip5=Plus vous avez d\u2019unit\u00E9s dans un arsenal, plus elles produisent des armes rapidement.
tip6=Lors de l\u2019affectation d\u2019unit\u00E9s, faites un clic droit sur les ic\u00F4nes + et \u2013 pour modifier les nombres par 10.
tip7=D\u00E9placez les unit\u00E9s s\u00E9lectionn\u00E9es dans un b\u00E2timent en faisant un clic droit dessus.
tip8=Plus vous avez d\u2019unit\u00E9s dans les quartiers, plus ceux-ci produisent de man\u0153uvres rapidement.
tip9=Plus vous avez d\u2019unit\u00E9s dans les quartiers, plus ils produiront rapidement un chef de tribu.
tip10=Les ouvriers peuvent d\u00E9molir les tours plus rapidement que les guerriers.
tip11=D\u00E9placer des unit\u00E9s avec l\u2019ordre d\u2019attaque au sol les am\u00E8nera \u00E0 attaquer les ennemis \u00E0 vue.
tip12=Appuyez sur Espace ou sur 5 du pav\u00E9 num\u00E9rique pour entrer en Mode Carte.
tip13=Placez le pointeur de la souris sur les unit\u00E9s et b\u00E2timents pour surveiller leur \u00E9tat.
tip14=Les unit\u00E9s et b\u00E2timents des alli\u00E9s sont entour\u00E9s d\u2019un cercle bleu lorsqu\u2019ils sont s\u00E9lectionn\u00E9s.
tip15=Faites d\u00E9filer la carte en d\u00E9pla\u00E7ant le pointeur de la souris vers le bord de l\u2019\u00E9cran ou avec les fl\u00E8ches du clavier.
tip16=Faites pivoter la vue avec 4 et 6 du pav\u00E9 num\u00E9rique ou avec les touches Insert et Delete.
tip17=D\u00E9finissez un point de ralliement pour indiquer o\u00F9 vos unit\u00E9s doivent se regrouper en sortant d\u2019un b\u00E2timent.
tip18=Regardez vers le haut ou le bas avec 2 et 8 du pav\u00E9 num\u00E9rique ou avec les touches Home et End.
tip19=Les armes fabriqu\u00E9es \u00E0 partir du poulet tropical peuvent ricocher et toucher plusieurs ennemis.
tip20=En Mode Carte, vos unit\u00E9s et b\u00E2timents sont surlign\u00E9s avec votre couleur de joueur.
tip21=Zoomez rapidement sur une autre zone de l\u2019\u00EEle en passant en Mode Carte et en cliquant sur l\u2019endroit souhait\u00E9.
tip22=S\u00E9lectionnez plusieurs unit\u00E9s en maintenant Maj enfonc\u00E9e tout en cliquant sur d\u2019autres unit\u00E9s.
tip23=S\u00E9lectionnez plusieurs unit\u00E9s en tra\u00E7ant un rectangle autour de celles que vous voulez choisir.
tip24=Pour construire de nouveaux b\u00E2timents rapidement, utilisez la fonction Transport pour envoyer un groupe de man\u0153uvres charg\u00E9s de bois.
tip25=Les tours sont id\u00E9ales pour d\u00E9fendre des b\u00E2timents, des man\u0153uvres ou des passages \u00E9troits.
tip26=Construisez des quartiers suppl\u00E9mentaires pour obtenir de nouveaux man\u0153uvres plus rapidement.
tip27=Construire des arsenaux pr\u00E8s des ressources pr\u00E9cieuses permet aux man\u0153uvres de les collecter beaucoup plus vite.
tip28=Pour produire ind\u00E9finiment un type d\u2019arme, augmentez la production jusqu\u2019\u00E0 ce qu\u2019un symbole infini apparaisse.
tip29=Changez la vitesse du jeu en appuyant sur + ou \u2013 du pav\u00E9 num\u00E9rique.
tip30=En partie, appuyez sur Entr\u00E9e pour \u00E9crire \u00E0 tous les joueurs et sur Maj + Entr\u00E9e pour \u00E9crire \u00E0 votre \u00E9quipe.
tip31=Quand une fl\u00E8che rouge, verte ou bleue clignote, appuyez sur Tab pour aller directement \u00E0 la zone indiqu\u00E9e.
tip32=Quand des unit\u00E9s sont \u00E9tourdies par le Terrifiant Couac, elles sont plus faciles \u00E0 toucher.
tip33=Le Rugissement D\u00E9vastateur inflige plus de d\u00E9g\u00E2ts \u00E0 courte port\u00E9e.
tip34=Une unit\u00E9 continue de subir des d\u00E9g\u00E2ts tant qu\u2019elle est envelopp\u00E9e dans les fum\u00E9es du Rago\u00FBt Puant.
tip35=Les unit\u00E9s alli\u00E9es sont habitu\u00E9es au Rago\u00FBt Puant, elles y r\u00E9sistent donc mieux.
tip36=Le Nuage Cr\u00E9pitant peut servir \u00E0 blesser des ennemis retranch\u00E9s dans des camps fortifi\u00E9s.
tip37=Utilisez Ctrl + B puis cliquez sur le sol pour placer une balise qui alerte votre \u00E9quipe.
tip38=Appuyez sur N pour parcourir vos man\u0153uvres inactifs.
