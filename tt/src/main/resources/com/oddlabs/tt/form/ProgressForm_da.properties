tip0=Ved at angribe fjender fra en h\u00F8jere position f\u00E5r dine krigere en taktisk fordel
tip1=Gem en markering ved at trykke Ctrl + 0-9 og v\u00E6lg den igen ved at trykke dens nummer
tip2=Hop til en gemt markering ved at dobbelt-trykke dens tildelte nummer
tip3=V\u00E6lg alle enheder af samme type indenfor sk\u00E6rmen ved at dobbeltklikke p\u00E5 en af disse
tip4=Zoom ind og ud ved at rulle p\u00E5 musehjulet eller ved at trykke Page Up og Page Down
tip5=Jo flere enheder du har i et arsenal, desto hurtigere kan de producere v\u00E5ben
tip6=N\u00E5r enheder tildeles, kan h\u00F8jreklik p\u00E5 + og - ikonerne bruges til at \u00E6ndre tallene med 10 ad gangen
tip7=Flyt markerede enheder ind i en bygning ved at h\u00F8jreklikke p\u00E5 bygningen.
tip8=Jo flere enheder du har i barakkerne, desto hurtigere vil de producere flere arbejdere
tip9=Jo flere enheder du har i barakkerne, desto hurtigere vil de producere en h\u00F8vding
tip10=Arbejdere kan rive t\u00E5rne ned hurtigere end krigere
tip11=Hvis enheder flyttes ved at angribe jorden, vil de angribe alle fjender de m\u00F8der p\u00E5 vejen
tip12=Tryk Mellemrum eller 5 p\u00E5 det numeriske tastatur for at komme til oversigtskortet
tip13=Hold musemark\u00F8ren over enheder og bygninger for at se deres status
tip14=Enheder og bygninger fra allierede hold markeres med en bl\u00E5 cirkel, n\u00E5r de er valgt
tip15=Bev\u00E6g dig rundt p\u00E5 kortet ved at flytte musen til kanten af sk\u00E6rmen eller ved at bruge piletasterne
tip16=Drej rundt ved at bruge 4 og 6 p\u00E5 det numeriske tastatur eller Insert og Delete
tip17=Angiv hvor dine enheder skal samles, n\u00E5r de forlader en bygning ved at angive et samlingspunkt
tip18=Kig op og ned ved at bruge 2 og 8 p\u00E5 det numeriske tastatur eller Home og End
tip19=V\u00E5ben lavet med tropisk kylling kan hoppe fra enhed til enhed og ramme flere fjender
tip20=P\u00E5 oversigtskortet er dine enheder og bygninger markeret med din spillerfarve
tip21=Hop hurtigt til en anden del af \u00F8en ved at skifte til oversigtskortet og klikke et sted p\u00E5 kortet
tip22=V\u00E6lg flere enheder ved at holde Shift nede og klikke p\u00E5 enhederne
tip23=V\u00E6lg flere enheder ved at tr\u00E6kke en boks udenom de enheder du vil v\u00E6lge
tip24=For hurtigere at bygge nye bygninger kan Transportfunktionen bruges til at sende arbejdere ud med tr\u00E6
tip25=T\u00E5rnene er velegnede til at forsvare bygninger, arbejdere eller sn\u00E6vre passager
tip26=Byg flere barakker for hurtigere at f\u00E5 flere arbejdere
tip27=Ved at bygge arsenaler t\u00E6t ved v\u00E6rdifulde ressourcer kan dine arbejdere hurtigere samle ressourcer
tip28=For at forts\u00E6tte produktionen af et v\u00E5ben p\u00E5 ubestemt tid, kan produktionen \u00F8ges indtil et uendelighedstegn vises
tip29=Juster hastigheden ved at trykke + eller - p\u00E5 det numeriske tastatur
tip30=Tryk Enter under et spil for at skrive en besked til alle spillere, og Shift + Enter for at skrive til allierede
tip31=Tryk Tab for at hoppe til et interesseomr\u00E5de, n\u00E5r en r\u00F8d, gr\u00F8n eller bl\u00E5 pil blinker
tip32=N\u00E5r enheder er blevet lammet af Terror Truttet, er de lettere at ramme
tip33=Det Bragende Br\u00F8l g\u00F8r mere skade p\u00E5 klods hold
tip34=En enhed bliver ved med at v\u00E6re p\u00E5virket af en Stinkende Stuvning, s\u00E5 l\u00E6nge den befinder sig i dens dampe
tip35=Venlige enheder er vant til den Stinkende Stuvning og er derfor mere modstandsdygtige
tip36=Den Tossede Tordensky kan bruges til at ramme fjender, der gemmer sig i bef\u00E6stede lejre
tip37=Ved at bruge Ctrl + B og klikke p\u00E5 jorden gives et signal, der alarmerer dit hold
tip38=Tryk N for at skifte mellem arbejdere der ikke laver noget
