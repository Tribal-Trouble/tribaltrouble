welcome_caption=Bienvenue dans Tribal Trouble
welcome_message=Merci d\u2019avoir t\u00E9l\u00E9charg\u00E9 Tribal Trouble !\n\nSi vous disposez d\u2019un code d\u2019enregistrement, cliquez sur S\u2019enregistrer pour obtenir la version compl\u00E8te de Tribal Trouble.\n\nSinon, vous pouvez essayer cette version d\u00E9mo, mais certaines fonctionnalit\u00E9s du jeu seront d\u00E9sactiv\u00E9es.\n\nN\u2019oubliez pas de mettre le jeu \u00E0 jour pour b\u00E9n\u00E9ficier des derni\u00E8res fonctionnalit\u00E9s et corrections. Cliquez sur Mettre \u00E0 jour maintenant ou utilisez l\u2019entr\u00E9e Mise \u00E0 jour dans le menu principal.
update_now=Mettre \u00E0 jour maintenant
register=S\u2019enregistrer
