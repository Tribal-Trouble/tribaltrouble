army_menu=Wr\u00F3\u0107 do g\u0142\u00F3wnego menu zbrojowni, klikaj\u0105c ikon\u0119 "Wstecz" (lub naciskaj\u0105c klawisz Esc). Aby wyposa\u017Cy\u0107 armi\u0119 w nowo wyprodukowan\u0105 bro\u0144, kliknij ikon\u0119 "Rozmie\u015B\u0107 armi\u0119" (lub naci\u015Bnij klawisz A).
army=Dla ka\u017Cdego rodzaju broni mo\u017Cesz wyszkoli\u0107 odpowiedni typ wojownika. U\u017Cyj ma\u0142ych ikonek "+" i "-", aby ustawi\u0107 liczb\u0119 wojownik\u00F3w. Spr\u00F3buj wyszkoli\u0107 armi\u0119 sk\u0142adaj\u0105c\u0105 si\u0119 z {0} kamiennych wojownik\u00F3w.
attack_tower=Twoja wie\u017Ca jest w\u0142a\u015Bnie atakowana przez niewielk\u0105 grup\u0119 wojownik\u00F3w wiking\u00F3w. Wojownik znajduj\u0105cy si\u0119 w wie\u017Cy automatycznie atakuje wszystkich wrog\u00F3w w zasi\u0119gu, wi\u0119c usi\u0105d\u017A wygodnie i ciesz si\u0119 widokiem rozgromionych wiking\u00F3w.
building_chieftain=Zbuduj kwatery i przenie\u015B do nich robotnik\u00F3w. Im wi\u0119cej jednostek znajduje si\u0119 w kwaterach, tym szybciej mo\u017Cesz wyszkoli\u0107 wodza. Zaznacz kwatery i kliknij ikon\u0119 "Wyszkol wodza" (lub naci\u015Bnij klawisz C).
build_menu=Wr\u00F3\u0107 do menu g\u0142\u00F3wnego zbrojowni, klikaj\u0105c ikon\u0119 "Wstecz" u do\u0142u ekranu (lub naciskaj\u0105c klawisz Esc). Aby wyprodukowa\u0107 bro\u0144, wybierz kilku robotnik\u00F3w, przenie\u015B ich do zbrojowni i kliknij ikon\u0119 "Wyprodukuj bro\u0144" znajduj\u0105c\u0105 si\u0119 poni\u017Cej ikony "Zbierz surowce" (lub naci\u015Bnij klawisz W).
chieftain_built=Nale\u017Cy pami\u0119ta\u0107, \u017Ce podczas szkolenia wodza kwatery nie generuj\u0105 nowych jednostek. Mo\u017Cesz przerwa\u0107 szkolenie wodza, klikaj\u0105c ponownie ikon\u0119 "Szkolenie wodza" (lub naciskaj\u0105c klawisz C). Ponowne klikni\u0119cie rozpocznie szkolenie nowego wodza od pocz\u0105tku.
empty_tower=Je\u015Bli potrzebujesz wojownika gdzie indziej lub wie\u017Ca ma zosta\u0107 zniszczona, mo\u017Cesz go usun\u0105\u0107 z wie\u017Cy. Aby usun\u0105\u0107 wojownika, wybierz wie\u017C\u0119 i kliknij ikon\u0119 wyj\u015Bcia (lub naci\u015Bnij X).
from_map_mode=W trybie mapy Twoje jednostki i budynki s\u0105 pod\u015Bwietlone kolorem gracza. Kliknij dowolne miejsce na mapie, aby powi\u0119kszy\u0107 dany punkt, lub naci\u015Bnij spacj\u0119 lub 5 na klawiaturze numerycznej, aby powr\u00F3ci\u0107 do poprzedniego widoku.
harvest_menu=W g\u00F3rnej cz\u0119\u015Bci ekranu wy\u015Bwietlany jest spis zasob\u00F3w, jednostek i broni znajduj\u0105cych si\u0119 w twojej zbrojowni. Aby zebra\u0107 zasoby potrzebne do produkcji broni, kliknij ikon\u0119 "Zbierz zasoby" (lub naci\u015Bnij klawisz G).
magic=W\u00F3dz dysponuje dwoma specjalnymi atakami magicznymi, kt\u00F3re wymagaj\u0105 czasu na na\u0142adowanie, zanim b\u0119d\u0105 gotowe do u\u017Cycia. Wybierz swojego wodza i wypr\u00F3buj oba ataki po kolei, klikaj\u0105c ich ikony (lub naciskaj\u0105c S lub C), gdy stan\u0105 si\u0119 dost\u0119pne.
map_mode=Naci\u015Bnij spacj\u0119 lub 5 na klawiaturze numerycznej, aby wej\u015B\u0107 w tryb mapy.
move_unit=Przesu\u0144 zaznaczone jednostki, korzystaj\u0105c z ikony "Przenie\u015B" (M) lub klikaj\u0105c prawym przyciskiem myszy na mapie (w systemie Mac OS X - Ctrl + klikni\u0119cie).
pitch=Aby przesuwa\u0107 widok w g\u00F3r\u0119 i w d\u00F3\u0142, u\u017Cyj klawiszy 2 i 8 na klawiaturze numerycznej lub klawiszy Home i End.
placing=Gr\u0119 rozpoczynasz z niewielk\u0105 grup\u0105 robotnik\u00F3w - najbardziej podstawowej jednostki. Robotnicy mog\u0105 budowa\u0107 i naprawia\u0107 budynki oraz zbiera\u0107 surowce. Zaznacz robotnik\u00F3w i kliknij ikon\u0119 kwater (lub naci\u015Bnij klawisz Q).
quarters=Zielone kwadraty wskazuj\u0105 potencjalne miejsca budowy. Najed\u017A kursorem myszy na jedno z nich i kliknij, aby zbudowa\u0107 budynek.
rally_point=Mo\u017Cesz wyznaczy\u0107 miejsce, w kt\u00F3rym twoi robotnicy powinni si\u0119 zgromadzi\u0107 po opuszczeniu kwater, ustalaj\u0105c punkt zbi\u00F3rki. Wybierz swoje kwatery, kliknij ikon\u0119 punktu zbi\u00F3rki (lub naci\u015Bnij klawisz R), a nast\u0119pnie kliknij w dowolnym miejscu na wyspie, aby wyznaczy\u0107 punkt zbi\u00F3rki.
repair=Podczas ataku twoja wie\u017Ca zosta\u0142a lekko uszkodzona. Stan budynku mo\u017Cna sprawdzi\u0107, naje\u017Cd\u017Caj\u0105c na niego wska\u017Anikiem myszy. Aby naprawi\u0107 budynek, zaznacz kilku robotnik\u00F3w, kliknij ikon\u0119 "Napraw" (lub naci\u015Bnij klawisz G), a nast\u0119pnie kliknij budynek. Napraw teraz swoj\u0105 wie\u017C\u0119.
rotate=Aby obr\u00F3ci\u0107 widok, u\u017Cyj klawiszy 4 i 6 na klawiaturze numerycznej lub klawiszy Insert i Delete.
scroll=Aby przesuwa\u0107 widok po mapie, przesu\u0144 wska\u017Anik myszy do kraw\u0119dzi ekranu lub u\u017Cyj klawiszy strza\u0142ek.
select_armory=Zaznacz swoich robotnik\u00F3w i kliknij ikon\u0119 zbrojowni (lub naci\u015Bnij klawisz R), aby zbudowa\u0107 zbrojowni\u0119. Gdy budynek zostanie uko\u0144czony, twoi robotnicy automatycznie do niego wejd\u0105. Kliknij budynek, aby go zaznaczy\u0107.
select_quarters=Najed\u017A kursorem myszy na plac budowy, aby \u015Bledzi\u0107 post\u0119p prac. U\u017Cyj klawiszy + i - na klawiaturze numerycznej, aby dostosowa\u0107 tempo gry. Gdy budynek zostanie uko\u0144czony, zaznacz go, klikaj\u0105c na niego. Jasnozielone k\u00F3\u0142ko wska\u017Ce, \u017Ce obiekt zosta\u0142 zaznaczony.
select_unit=Aby zaznaczy\u0107 jednostk\u0119, kliknij na ni\u0105. Aby zaznaczy\u0107 wiele jednostek, przytrzymaj klawisz Shift i klikaj kolejne jednostki lub przeci\u0105gnij ramk\u0119 zaznaczenia wok\u00F3\u0142 jednostek, kt\u00F3re chcesz zaznaczy\u0107. Mo\u017Cesz r\u00F3wnie\u017C zaznaczy\u0107 wszystkie jednostki tego samego typu w widoku, klikaj\u0105c dwukrotnie jedn\u0105 z nich. Zaznaczone jednostki s\u0105 oznaczone jasnozielonym k\u00F3\u0142kiem.
supply=Dla ka\u017Cdego rodzaju surowca mo\u017Cesz klikn\u0105\u0107 ma\u0142\u0105 ikonk\u0119 "+", aby przydzieli\u0107 robotnik\u00F3w do zbierania tego surowca. Robotnicy b\u0119d\u0105 to robi\u0107 tak d\u0142ugo, dop\u00F3ki ich nie zaznaczysz i nie wydasz im innych polece\u0144. Spr\u00F3buj zebra\u0107 {0} drewna i {1} kamienia.
tutorial_over=Zbuduj kwatery i zbrojowni\u0119, zbierz surowce, wyprodukuj bro\u0144 i stw\u00F3rz armi\u0119. Wybierz swoj\u0105 armi\u0119, kliknij ikon\u0119 "Atak" (lub naci\u015Bnij klawisz A), przewi\u0144 ekran na drug\u0105 stron\u0119 wyspy i kliknij na wrogie plemi\u0119 lub budynki albo w ich pobli\u017Cu. Zniszcz wszystkie wrogie jednostki i budynki!
unit_count=G\u0142\u00F3wnym zadaniem kwater jest wytwarzanie nowych robotnik\u00F3w. Im wi\u0119cej robotnik\u00F3w znajduje si\u0119 w budynku, tym szybciej b\u0119d\u0105 oni wytwarzani. Zaznacz budynek i kliknij ma\u0142\u0105 ikon\u0119 "+", aby wyprowadzi\u0107 robotnik\u00F3w z kwater. Postaraj si\u0119 wyprowadzi\u0107 co najmniej {0} robotnik\u00F3w z kwatery.
unit_in_tower=Jednostka wojownika umieszczona w wie\u017Cy otrzymuje premi\u0119 do ataku i nie mo\u017Ce zosta\u0107 zabita, dop\u00F3ki wie\u017Ca nie zostanie zniszczona. Aby umie\u015Bci\u0107 wojownika w wie\u017Cy, kliknij prawym przyciskiem myszy na wie\u017C\u0119, maj\u0105c zaznaczon\u0105 jednostk\u0119 wojownika. Umie\u015B\u0107 wojownika w wie\u017Cy.
units_in_quarters=Wybierz swoich robotnik\u00F3w i przenie\u015B ich do kwater, klikaj\u0105c ikon\u0119 "Przenie\u015B" (lub naciskaj\u0105c klawisz M), a nast\u0119pnie klikaj\u0105c na kwatery, albo po prostu klikaj\u0105c prawym przyciskiem myszy na kwatery (Ctrl + klikni\u0119cie w systemie Mac OS X).
weapon=Dla ka\u017Cdego dost\u0119pnego typu broni u\u017Cyj ma\u0142ych ikonek "+" i "-", aby ustawi\u0107 liczb\u0119 sztuk broni, kt\u00F3re maj\u0105 wyprodukowa\u0107 twoi robotnicy (najed\u017A kursorem myszy na ikony, aby sprawdzi\u0107, jakie surowce s\u0105 potrzebne). Im wi\u0119cej robotnik\u00F3w znajduje si\u0119 w budynku, tym szybciej b\u0119d\u0105 produkowa\u0107 bro\u0144. Postaraj si\u0119 wyprodukowa\u0107 {0} sztuk broni kamiennej.
zoom=Aby powi\u0119ksza\u0107 i pomniejsza\u0107 obraz, przewi\u0144 k\u00F3\u0142kiem myszy lub u\u017Cyj klawiszy Page Up i Page Down. Mo\u017Cesz te\u017C przytrzyma\u0107 klawisz Z i przesuwa\u0107 mysz\u0105 w g\u00F3r\u0119 i w d\u00F3\u0142.
select_tower=Zaznacz swoich robotnik\u00F3w, kliknij "Wie\u017Ca" (lub naci\u015Bnij klawisz T) i znajd\u017A odpowiednie miejsce na jej budow\u0119. Gdy wie\u017Ca zostanie zbudowana, zaznacz j\u0105.
fpc=Przytrzymuj\u0105c klawisz F lub \u015Brodkowy przycisk myszy, mo\u017Cesz zmienia\u0107 kierunek kamery, poruszaj\u0105c mysz\u0105.
