army_menu=Volte para o menu principal da armaria clicando no icone de Voltar (ou pressionando Esc). Para equipar um ex\u00E9rcito com suas armas rec\u00E9m produzidas, clique no \u00EDcone de Mobilizar Ex\u00E9rcito (ou pressione A).
army=Para cada tipo de arma, voc\u00EA pode treinar um guerreiro correspondente. use os pequenos \u00EDcones de + e - para ajustar quantos guerreiros voc\u00EA quer. tente treinar um ex\u00E9rcito de {0} guerreiros de pedra.
attack_tower=Sua torre agora est\u00E1 sendo atacada por um pequeno grupo de guerreiros viking. Um guerreiro em cima da torre ataca todos os inimigos automaticamente dentro de seu alcance, ent\u00E3o se acomode e divirta-se vendo os Vikings sendo massacrados.
building_chieftain=Construa os alojamentos e mova seus pe\u00F5es dentro. Quanto mais unidades voc\u00EA tem dentro dos alojamentos, mais r\u00E1pido voc\u00EA pode treinar um chefe. Selecione os alojamentos e clique no icone de Treinar Chefe (ou pressione C).
build_menu=Volte para o menu principal da armaria clicando no icone de Voltar (ou pressione Esc). Para produzir algumas armas, selecione alguns de seus pe\u00F5es, movimente eles para dentro da armaria e clique no \u00EDcone de Produzir Armas localizado abaixo do \u00EDcone de Coletar Recursos (ou pressione W).
chieftain_built=Perceba que enquanto o chefe est\u00E1 sendo treinado, os alojamentos n\u00E3o geram novas unidades. Voc\u00EA pode abortar o treinamento do chefe clicando no \u00EDcone de Treinar Chefe novamente (ou pressionando C). Clicar novamente vai come\u00E7ar a treinar um novo chefe do in\u00EDcio.
empty_tower=Se voc\u00EA precisa do guerreiro em outro lugar ou a torre est\u00E1 prestes a ser destru\u00EDda, voc\u00EA pode remov\u00EA-lo da torre. Remova seu guerreiro selecionando a torre e clicando no \u00EDcone de Sair (ou pressionando X).
from_map_mode=No Modo Mapa, suas unidades e edif\u00EDcios s\u00E3o marcadas com a sua cor de jogador. Clique em algum canto do mapa para aproximar nesse local ou pressione espa\u00E7o ou teclado num\u00E9rico 5 para retornar \u00E0 vis\u00E3o anterior.
harvest_menu=O invent\u00E1rio de recursos, unidades e armas da sua armaria \u00E9 mostrado no topo. Para coletar alguns recursos para produzir armas, clique no \u00EDcone de Coletar Recursos (ou pressione G).
magic=O chefe possui dois ataques m\u00E1gicos especiais, e ambos requerem um pouco de tempo para carregarem antes de serem utilizados. Selecione seu chefe e tente ambos ataques alternadamente clicando nos seus \u00EDcones (ou pressionando S ou C) quando eles ficarem dispon\u00EDveis.
map_mode=Pressione espa\u00E7o ou teclado num\u00E9rico para entrar no Modo Mapa.
move_unit=Movimente as unidades selecionadas usando o \u00EDcone de Mover (M) ou clicando com o bot\u00E3o direito no mapa (Ctrl + clique no Mac OS X).
pitch=Olhe para cima e para baixo usando o 2 e 8 no teclado num\u00E9rico ou Home e End.
placing=Voc\u00EA come\u00E7a a partida com um pequeno grupo de pe\u00F5es, a unidade mais b\u00E1sica. Pe\u00F5es podem construir e reparar edif\u00EDcios e coletar recursos. Selecione seus pe\u00F5es e clique no \u00EDcone dos Alojamentos (ou pressione Q).
quarters=O quadrado verde indica locais poss\u00EDveis para a constru\u00E7\u00E3o. Passe o ponteiro do mouse sobre um deles, e clique para construir o edif\u00EDcio.
rally_point=Voc\u00EA pode direcionar onde seus pe\u00F5es dever\u00E3o se re\u00FAnir quando sa\u00EDrem dos alojamentos ao colocar um ponto de encontro. Selecione seus alojamentos, clique no \u00EDcone de Ponto de Encontro (ou pressione R) e clique em algum lugar na ilha para posicionar o ponto de encontro.
repair=Enquanto estava sendo atacada, sua torre ficou levemente danificada. Voc\u00EA pode ver o estado de um edif\u00EDcio passando o ponteiro do mouse sobre ele. Repare um edif\u00EDcio selecionando alguns pe\u00F5es, clicando no \u00EDcone de Reparar (ou pressionando G) e clique no edif\u00EDcio. Repare sua torre agora.
rotate=Gire a vis\u00E3o usando 4 e 6 no teclado num\u00E9rico ou Insert e Delete.
scroll=Fa\u00E7a uma panor\u00E2mica pelo mapa movendo o ponteiro do mouse na ponta da tela ou usando as teclas de seta.
select_armory=Selecione seus pe\u00F5es e clique no \u00EDcone de Armaria (ou pressione R) para construir uma armaria. Quando o edif\u00EDcio estiver conclu\u00EDdo, seus pe\u00F5es v\u00E3o entrar dentro automaticamente. clique no edif\u00EDcio para selecion\u00E1-lo.
select_quarters=Passe com o ponteiro do mouse sobre um edif\u00EDcio em constru\u00E7\u00E3o para monitorar o progresso. Use + e - no teclado num\u00E9rico para ajustar a velocidade da partida. Quando o edif\u00EDcio for conclu\u00EDdo, selecione-o clicando nele. Um brilhante c\u00EDrculo verde vai indicar quanto ele estiver selecionado.
select_unit=Selecione uma unidade clicando nela. Selecione multiplas unidades segurando o shift enquanto clica em mais unidades ou arrastando uma caixa de sele\u00E7\u00E3o na unidades que deseja selecionar. Voc\u00EA tamb\u00E9m pode selecionar todas as unidades do mesmo tipo dentro da vis\u00E3o dando um clique duplo em uma delas. Unidades selecionadas s\u00E3o marcadas com um brilhante c\u00EDrculo verde.
supply=Para cada tipo de recurso, voc\u00EA pode clicar no pequeno \u00EDcone de + para atribu\u00EDr pe\u00F5es para coletar aquele tipo de recurso. Os pe\u00F5es v\u00E3o continuar \u00E0 fazer isso at\u00E9 voc\u00EA selecion\u00E1-los e dar \u00E0 eles ordens diferentes. Tente coletar {0} madeira e {1} recursos de pedra.
tutorial_over=Construa os alojamentos e uma armaria, colete recursos, produza algumas armas e mobilize um ex\u00E9rcito. Selecione seu ex\u00E9rcito, clique no \u00EDcone de Atacar (ou pressione A), movimente-se at\u00E9 o outro lado da ilha e clique no ou pr\u00F3ximo dos membros da tribo e edif\u00EDcios inimigos. Destrua todas as unidades e edif\u00EDcios inimigos!
unit_count=A principal fun\u00E7\u00E3o dos alojamentos \u00E9 produzir novos pe\u00F5es. Quanto mais pe\u00F5es voc\u00EA tiver em um edif\u00EDcio, mais r\u00E1pido ele vai produzir mais pe\u00F5es. Selecione o edif\u00EDcio e clique no pequeno \u00EDcone de + para mover pe\u00F5es para fora dos alojamentos. Tente mover pelo menos {0} pe\u00F5es fora dos alojamentos.
unit_in_tower=Uma unidade guerreira na torre recebe um ataque bonus e n\u00E3o pode ser morta \u00E0 menos que a torre seja destru\u00EDda. Voc\u00EA pode posicionar um guerreiro em cima da torre dando um clique direito na torre enquanto voc\u00EA tiver uma unidade guerreira selecionada. Coloque seu guerreiro em cima da torre.
units_in_quarters=Selecione seus pe\u00F5es e movimente-os dentro dos alojamentos clicando no \u00EDcone de Mover (ou pressionando M) e ent\u00E3o clicando nos alojamentos ou simplesmente dando um clique direito nos alojamentos (Ctrl + clique no Mac OS X).
weapon=Para cada tipo de arma dispon\u00EDvel, use os pequenos \u00EDcones de + e - para ajustar quantas armas voc\u00EA quer que seus pe\u00F5es produzam (mova o ponteiro do mouse sobre os \u00EDcones para ver que recursos s\u00E3o requeridos). Quanto mais pe\u00F5es voc\u00EA tiver em um edif\u00EDcio, mais r\u00E1pido eles v\u00E3o produzir as armas. Tente produzir {0} armas de pedra.
zoom=Aproxime e distancie girando a roda do mouse ou usando Page Up e Page Down. Voc\u00EA tamb\u00E9m pode segurar Z e mover o mouse para cima e para baixo.
select_tower=Selecione seus pe\u00F5es, clique no \u00EDcone de Torre (ou pressione T) e encontre um local adequado para construir a sua torre. Quando sua torre estiver construida, selecione-a.
fpc=Enquanto segurar a tecla F ou o bot\u00E3o do meio do mouse, voc\u00EA pode alterar a dire\u00E7\u00E3o da camera movendo o mouse.
