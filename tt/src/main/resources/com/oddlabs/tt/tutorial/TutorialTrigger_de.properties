army_menu=Klicken Sie auf die Schaltfl\u00E4che ''Zur\u00FCck'', oder dr\u00FCcken Sie die ESC-TASTE, um zum Zeughaus-Hauptmen\u00FC zur\u00FCckzukehren. Wenn Sie eine Armee mit den neu produzierten Waffen ausr\u00FCsten m\u00F6chten, klicken Sie auf das Symbol ''Armee ausr\u00FCsten'', oder dr\u00FCcken Sie A.
army=F\u00FCr jede dieser Waffenarten k\u00F6nnen Sie einen entsprechenden Kriegertyp ausbilden. Mit den kleinen Symbolen ''+'' und ''-'' k\u00F6nnen Sie festlegen, wie viele Krieger Sie ben\u00F6tigen. Versuchen Sie, eine Armee von {0} Steinkriegern auszubilden.
attack_tower=Ihr Turm wird von einer kleinen Gruppe von Wikingerkriegern angegriffen. Ein Krieger in einem Turm greift automatisch alle Feinde innerhalb seiner Reichweite an. Machen Sie es sich also bequem, und sehen Sie zu, wie die Wikinger abgeschlachtet werden.
building_chieftain=Bauen Sie ein Quartier, und bringen Sie Ihre Knechte nach drinnen. Je mehr Einheiten sich im Quartier befinden, desto schneller k\u00F6nnen Sie einen H\u00E4uptling ausbilden. Markieren Sie das Quartier, und klicken Sie auf das Symbol ''H\u00E4uptling ausbilden'', oder dr\u00FCcken Sie C.
build_menu=Klicken Sie auf die Schaltfl\u00E4che ''Zur\u00FCck'', oder dr\u00FCcken Sie die ESC-TASTE, um zum Zeughaus-Hauptmen\u00FC zur\u00FCckzukehren. Wenn Sie Waffen herstellen m\u00F6chten, markieren Sie einige Knechte, bringen Sie sie in das Zeughaus, und klicken Sie auf das Symbol ''Waffen herstellen'' unter dem Symbol ''Ressourcen sammeln'', oder dr\u00FCcken Sie W.
chieftain_built=Beachten Sie, dass keine neuen Einheiten erstellt werden, solange der H\u00E4uptling ausgebildet wird. Sie k\u00F6nnen die H\u00E4uptlingsausbildung abbrechen, indem Sie erneut auf das Symbol ''H\u00E4uptling ausbilden'' klicken oder C dr\u00FCcken. Wenn Sie erneut auf das Symbol klicken, wird ein neuer H\u00E4uptling von Grund auf ausgebildet.
empty_tower=Wenn der Krieger anderswo eingesetzt werden soll oder der Turm kurz vor der Zerst\u00F6rung steht, k\u00F6nnen Sie den Krieger vom Turm nehmen. Markieren Sie dazu den Turm, und klicken Sie auf das Symbol ''Beenden'', oder dr\u00FCcken Sie X. 
from_map_mode=Im Kartenmodus werden Ihre Einheiten und Geb\u00E4ude mit Ihrer Spielerfarbe markiert. Klicken Sie auf eine beliebige Stelle auf der Karte, um darauf einzuzoomen, oder dr\u00FCcken Sie die LEERTASTE bzw. 5 auf dem Ziffernblock, um zur vorherigen Ansicht zur\u00FCckzukehren.
harvest_menu=Die Ressourcen, Einheiten und Waffen im Zeughaus werden oben angezeigt. Klicken Sie auf das Symbol ''Ressourcen sammeln'', oder dr\u00FCcken Sie G, um Material f\u00FCr den Waffenbau zu sammeln.
magic=Der H\u00E4uptling verf\u00FCgt \u00FCber zwei besondere magische Angriffsstrategien, deren Ladevorgang einige Zeit in Anspruch nimmt. Markieren Sie Ihren H\u00E4uptling, und probieren Sie beide Angriffe aus, indem Sie auf die entsprechenen Symbole klicken bzw. S oder C dr\u00FCcken, sobald sie verf\u00FCgbar werden.
map_mode=Dr\u00FCcken Sie die LEERTASTE oder die 5 auf dem Ziffernblock, um den Kartenmodus aufzurufen.
move_unit=Bewegen Sie die markierten Einheiten, indem Sie auf das Symbol ''Bewegen'' klicken (bzw. M dr\u00FCcken), oder mit der rechten Maustaste auf die Karte klicken (Mac OS X: STRG+Klick).
pitch=Mit den Ziffern 2 und 8 auf dem Ziffernblock oder mit den POS1- und ENDE-TASTEN k\u00F6nnen Sie nach oben oder unten blicken.
placing=Sie beginnen das Spiel mit einer kleinen Gruppe Knechte. Diese stellen die einfachste Einheit dar. Knechte k\u00F6nnen Geb\u00E4ude bauen und reparieren sowie Ressourcen sammeln. Markieren Sie Ihre Knechte, und klicken Sie auf das Symbol ''Quartier'', oder dr\u00FCcken Sie Q.
quarters=Die gr\u00FCnen Quadrate zeigen m\u00F6gliche Baupl\u00E4tze an. Bewegen Sie den Mauszeiger \u00FCber eines dieser Quadrate, und klicken Sie darauf, um das Geb\u00E4ude zu errichten.
rally_point=Sie k\u00F6nnen festlegen, wo sich Ihre Knechte zusammenfinden sollen, wenn sie das Quartier verlassen, indem Sie einen Versammlungsort festlegen. Markieren Sie dazu das Quartier, klicken Sie auf das Symbol ''Versammlungsort'', oder dr\u00FCcken Sie R, und klicken Sie auf einen beliebigen Punkt auf der Insel, um den Versammlungsort festzulegen.
repair=Bei einem Angriff wurde Ihr Turm leicht besch\u00E4digt. Sie k\u00F6nnen den Status eines Geb\u00E4udes anzeigen, indem Sie den Mauszeiger dar\u00FCber bewegen. Zum Reparieren eines Geb\u00E4udes markieren Sie einige Knechte, klicken auf das Symbol ''Reparieren'', oder dr\u00FCcken G, und klicken auf das Geb\u00E4ude. Reparieren Sie nun Ihren Turm.
rotate=Zum Drehen der Ansicht verwenden Sie die Ziffern 4 und 6 auf dem Ziffernblock oder die EINFG- und ENTF-TASTEN.
scroll=Sie k\u00F6nnen in der Karte navigieren, indem Sie den Mauszeiger zum Bildschirmrand bewegen oder die Pfeiltasten verwenden.
select_armory=Markieren Sie Ihre Knechte, und klicken Sie auf das Symbol ''Zeughaus'', oder dr\u00FCcken Sie R, um ein Zeughaus zu errichten. Wenn das Geb\u00E4ude fertig ist, gehen die Knechte automatisch nach drinnen. Klicken Sie auf das Geb\u00E4ude, um es zu markieren.
select_quarters=Bewegen Sie den Mauszeiger \u00FCber den Bauplatz, um den Fortschritt zu \u00FCberwachen. Dr\u00FCcken Sie + und - auf dem Ziffernblock, um die Spielgeschwindigkeit anzupassen. Wenn das Geb\u00E4ude fertig ist, klicken Sie darauf, um es zu markieren. Ein hellgr\u00FCner Kreis zeigt an, dass ein Geb\u00E4ude markiert ist.
select_unit=Markieren Sie eine Einheit, indem Sie darauf klicken. Mehrere Einheiten markieren Sie, indem Sie die UMSCHALTTASTE gedr\u00FCckt halten, w\u00E4hrend Sie auf mehrere Einheiten klicken, oder indem Sie ein Markierungsfeld um die Einheiten ziehen, die Sie markieren m\u00F6chten. Sie k\u00F6nnen auch alle Einheiten derselben Art markieren, indem Sie auf eine Einheit doppelklicken. Markierte Einheiten werden mit einem hellgr\u00FCnen Kreis dargestellt.
supply=F\u00FCr jeden Ressourcentyp k\u00F6nnen Sie auf das kleine +-Symbol klicken, um Knechte zu bestimmen, die diese Ressourcenart sammeln. Die Knechte tun dies, bis Sie sie erneut markieren und Ihnen andere Anweisungen geben. Versuchen Sie, {0} Holz- und {1} Steinressourcen zu sammeln.
tutorial_over=Errichten Sie ein Quartier und ein Zeughaus, sammeln Sie Ressourcen, stellen Sie Waffen her, und r\u00FCsten Sie eine Armee aus. Markieren Sie eine Armee, klicken Sie auf das Symbol ''Angreifen'', oder dr\u00FCcken Sie A, scrollen Sie zur anderen Seite der Insel, und klicken Sie auf oder neben feindliche St\u00E4mme oder Geb\u00E4ude. Vernichten Sie alle feindlichen Einheiten und Geb\u00E4ude!
unit_count=Die Hauptfunktion des Quartiers ist es, neue Knechte zu produzieren. Je mehr Knechte zu einem Geb\u00E4ude geh\u00F6ren, desto schneller werden weitere Knechte produziert. Markieren Sie das Geb\u00E4ude, und klicken Sie auf das kleine +-Symbol, um die Knechte aus dem Quartier zu bewegen. Versuchen Sie, mindestens {0} Knechte aus dem Quartier zu bewegen.
unit_in_tower=Eine Kriegereinheit in einem Turm erh\u00E4lt einen Angriffsbonus und kann nur vernichtet werden, wenn der Turm zerst\u00F6rt wird. Sie k\u00F6nnen einen Krieger in einem Turm platzieren, indem Sie mit der rechten Maustaste auf den Turm klicken, w\u00E4hrend eine Kriegereinheit markiert ist. Platzieren Sie Ihren Krieger im Turm.
units_in_quarters=Markieren Sie Ihre Knechte, und bringen Sie sie ins Quartier. Klicken Sie dazu auf das Symbol ''Bewegen'' bzw. dr\u00FCcken Sie M, und klicken Sie anschlie\u00DFend auf das Quartier, oder klicken Sie einfach mit der rechten Maustaste auf das Quartier (Mac OS X: STRG+Klick).
weapon=F\u00FCr jeden verf\u00FCgbaren Waffentyp k\u00F6nnen Sie mit den kleinen Symbolen + und - festlegen, wie viele Waffen Ihre Knechte produzieren sollen (bewegen Sie den Mauszeiger \u00FCber die Symbole, um anzuzeigen, welche Ressourcen ben\u00F6tigt werden). Je mehr Knechte zu einem Geb\u00E4ude geh\u00F6ren, desto schneller k\u00F6nnen sie Waffen herstellen. Versuchen Sie, {0} Steinwaffen zu produzieren.
zoom=Zum Ein- und Auszoomen verwenden Sie das Mausrad oder die BILD-AB- bzw. BILD-AUF-TASTE. Sie k\u00F6nnen auch Z gedr\u00FCckt halten und die Maus nach oben und unten bewegen.
select_tower=Markieren Sie Ihre Knechte, klicken Sie auf das Symbol ''Turm'', oder dr\u00FCcken Sie T, und suchen Sie einen geeigneten Ort, an dem Sie einen Turm errichten k\u00F6nnen. Wenn der Turm fertig ist, markieren Sie ihn.
fpc=Wenn Sie F oder das Mausrad gedr\u00FCckt halten, k\u00F6nnen Sie die Kameraperspektive ver\u00E4ndern, indem Sie die Maus bewegen.
