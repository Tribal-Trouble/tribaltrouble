army_menu=Vuelve al men\u00FA principal de la armer\u00EDa pulsando el icono Atr\u00E1s (o pulsando Esc). Para equipar un ej\u00E9rcito con el arma que acabas de producir pulsa en el bot\u00F3n de Desplegar ej\u00E9rcito (o pulsa la tecla A).
army=Para cada tipo de arma, puedes entrenar un tipo de guerrero distinto. Pulsando "+" o "-" puedes elegir cuantos guerreros de ese tipo quieres. Intenta entrenar {0} guerreros piedra (guerreros entrenados con arma de piedra).
attack_tower=Tu torre est\u00E1 siendo atacada por un peque\u00F1o grupo de guerreros vikingos. El guerrero de la torre atacar\u00E1 autom\u00E1ticamente a todos los enemigos que est\u00E9n en su rango de alcance, as\u00ED que ponte c\u00F3modo y disfruta viendo como los vikingos son aniquilados.
building_chieftain=Construye los barracones y mete los peones dentro. Cuantos m\u00E1s peones haya en los barracones, m\u00E1s r\u00E1pidamente podr\u00E1s entrenar a un jefe tribal. Selecciona los Barracones y pulsa en el bot\u00F3n Entrenar jefe tribal (o pulsa C).
build_menu=Vuelve al men\u00FA principal de la armer\u00EDa pulsando el icono atr\u00E1s (o pulsando Esc). Para producir algunas armas, mete unos cuantos peones en la armer\u00EDa, y pulsa en el icono Fabricar Armas, que est\u00E1 debajo del de Recolectar Recursos (o pulsa W).
chieftain_built=Recuerda que mientras se est\u00E9 entrenando al jefe tribal, los barracones no generar\u00E1n nuevas unidades. Puedes cancelar este entrenamiento pulsando de nuevo el icono de Entrenar jefe tribal (o pulsando C). M\u00E1s tarde, si vuelves a entrenar un jefe tribal, este se entrenar\u00E1 desde cero.
empty_tower=Si necesitas al guerrero en otro sitio, o si la torre est\u00E1 a punto de ser destruida, puedes sacar de ah\u00ED al guerrero pulsando el icono Salir (o pulsando la tecla X).
from_map_mode=En el modo mapa, tus unidades y edificios est\u00E1n resaltados con tu color de jugador. Pulsa en cualquier lugar del mapa para hacer un zoom a esa zona, o bien pulsa la tecla espacio o 5 del teclado num\u00E9rico para volver a la vista anterior.
harvest_menu=El inventario de recursos, unidades y armas de tu armer\u00EDa se muestran arriba. Para conseguir recursos con los que crear nuevas armas, pulsa en Recolectar recursos (o pulsa la tecla G).
magic=El jefe tribal tiene dos ataques m\u00E1gicos especiales, que requieren un cierto tiempo de recarga antes de poder usarse. Selecciona tu jefe tribal e intenta realizar los dos ataques m\u00E1gicos alternativamente pulsando sobre sus iconos (o pulsando las teclas S o C) cuando est\u00E9n recargados.
map_mode=Pulsa espacio o la tecla 5 del teclado num\u00E9rico para entrar en modo mapa.
move_unit=Mueve las unidades seleccionadas usando el icono de mover (M) o haciendo doble click sobre un punto del mapa (control+click en Mac OS X).
pitch=Mira arriba y abajo usando 2 y 8 del teclado num\u00E9rico o Inicio y Fin.
placing=Empiezas el juego con un peque\u00F1o grupo inicial de peones, tus unidades m\u00E1s b\u00E1sicas. Los peones pueden construir y reparar edificios, as\u00ED como recolectar recursos necesarios para otras tareas. Selecciona los peones y pulsa en el icono de los barracones (o pulsa Q).
quarters=Las casillas verdes indican d\u00F3nde puedes construir los barracones. Pasa el rat\u00F3n por encima de una de esas casillas y haz click para construir los barracones.
rally_point=Puedes decidir hacia donde van los peones cuando salen de los barracones. Selecciona los barracones, pincha en el icono del Punto de encuentro (o pulsa R) y haz click en el mapa en la zona de destino elegida.
repair=Mientras la atacan, la torre puede resultar ligeramente da\u00F1ada. Para ver su estado, pasa el cursor por encima suya. Se repara un edificio seleccionando unos peones, pulsando en Reparar y seleccionando el edificio a reparar. Ahora, repara tu torre.
rotate=Rota la vista usando 4 y 6 del teclado num\u00E9rico o con Insert y Supr.
scroll=Despl\u00E1zate por el mapa llevando el cursor a los extremos de la pantalla o pulsando las teclas de direcci\u00F3n.
select_armory=Selecciona tus peones y haz click en el icono de la Armer\u00EDa (o pulsa R) para que construyan la armer\u00EDa. Cuando el edificio est\u00E9 completo, los peones entrar\u00E1n en \u00E9l. Haz click en el edificio para seleccionarlo.
select_quarters=Pasa el cursor por encima del lugar de la construcci\u00F3n para ver su progreso. Usa + y - en el teclado num\u00E9rico para ajustar la velocidad del juego. Cuando el edificio est\u00E9 completo, selecci\u00F3nalo haciendo click en \u00E9l. Un brillante c\u00EDrculo verde indicar\u00E1 que est\u00E1 seleccionado.
select_unit=Selecciona una unidad haciendo click en ella. Selecciona m\u00FAltiples unidades pulsando may\u00FAsculas mientras haces click en ellas o bien trazando un rect\u00E1ngulo de selecci\u00F3n alrededor de las unidades. Tambi\u00E9n puedes seleccionar todas las unidades visibles de un mismo tipo haciendo doble click encima de una de ellas. Las unidades seleccionadas aparecer\u00E1n con un c\u00EDrculo verde.
supply=Para cada tipo de recurso, puedes hacer click en el peque\u00F1o icono + para asignar peones a la recolecci\u00F3n de ese recurso. Los peones seguir\u00E1n haciendo este trabajo constantemente hasta que les des otra orden. Intenta recolectar {0} recursos de madera y {1} de piedra.
tutorial_over=Construye barracones y una armer\u00EDa, recolecta recursos, crea algunas armas y despliega un peque\u00F1o ej\u00E9rcito. Selecciona tu ej\u00E9rcito y pulsa en el icono de Atacar (o pulsa A), despl\u00E1zate hasta la otra punta de la isla y pincha sobre alguno de tus enemigos o sus edificios. \u00A1Aniquila a todos los enemigos y destruye sus edificios!
unit_count=La funci\u00F3n principal de los barracones es la de producir peones. Cuantos m\u00E1s peones tengas dentro, m\u00E1s r\u00E1pido se producir\u00E1n nuevos peones. Selecciona el edificio y pulsa sobre el peque\u00F1o icono + para sacar peones al exterior. Intenta sacar {0} peones al exterior.
unit_in_tower=Una unidad guerrera (un guerrero) en la torreo recibe un bonificador de ataque y no puede morir salvo que la torre sea destruida. Puedes poner un guerrero en una torre haciendo doble click en la torre tras haber seleccionado a un guerrero. Ahora pon un guerrero en tu torre.
units_in_quarters=Lleva tus unidades seleccionadas a los barracones pinchando en el icono de Mover (o tecla M) y a continuaci\u00F3n seleccionando los barracones o s\u00EDmplemente haciendo doble click en los barracones (Control-click en Mac OS X).
weapon=Para cada tipo de arma disponible, usa los iconos + y - para determinar cu\u00E1ntas armas quieres que produzcan tus peones. Pasa el cursor por encima de los iconos para ver que recursos son necesarios. Cuantos m\u00E1s peones tengas trabajando en la armer\u00EDa, m\u00E1s r\u00E1pidamente podr\u00E1n fabricar las nuevas armas. Intenta fabricar {0} armas de piedra.
zoom=Acerca y aleja el zoom moviendo la rueda del rat\u00F3n o pulsando R\u00E9 P\u00E1g o Av P\u00E1g. Tambi\u00E9n puedes pulsar la tecla Z y mover el rat\u00F3n arriba y abajo.
select_tower=Selecciona a tus peones, pincha en el icono Torre (o pulsa T) y pincha en una zona adecuada para crear tu torre. Una vez haya sido creada, selecci\u00F3nala.
fpc=Mientras dejas pulsada la tecla F o el bot\u00F3n central del rat\u00F3n, si mueves el rat\u00F3n podr\u00E1s cambiar la direcci\u00F3n de la c\u00E1mara.
