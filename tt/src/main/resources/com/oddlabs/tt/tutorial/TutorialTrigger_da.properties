army_menu=G\u00E5 tilbage til arsenal hovedmenuen ved at klikke p\u00E5 "Tilbage" ikonet (eller trykke Esc). For at bev\u00E6bne en h\u00E6r med dine nyproducerede v\u00E5ben, skal du klikke p\u00E5 "Udsend h\u00E6r"-ikonet (eller trykke A).
army=For hver af v\u00E5bentyperne, kan du tr\u00E6ne en tilsvarende krigertype. Brug de sm\u00E5 "+" og "-" ikoner til at angive hvor mange krigere, du vil have. Pr\u00F8v at tr\u00E6ne en h\u00E6r med {0} stenkrigere.
attack_tower=Dit t\u00E5rn bliver angrebet af en lille gruppe vikingekrigere. En kriger i et t\u00E5rn angriber automatisk alle fjender indenfor r\u00E6kkevidde, s\u00E5 l\u00E6n dig tilbage og nyd, at vikingerne bliver slagtet.
building_chieftain=Byg en barak og flyt dine arbejdere derind. Jo flere enheder du har i dine barakker, desto hurtigere kan de tr\u00E6ne en h\u00F8vding. V\u00E6lg barakkerne og klik p\u00E5 "Tr\u00E6n h\u00F8vding" ikonet (eller tryk C).
build_menu=G\u00E5 tilbage til arsenalets hovedmenu ved at klikke p\u00E5 "Tilbage" ikonet i bunden (eller trykke Esc). For at producere v\u00E5ben skal du v\u00E6lge nogle arbejdere, flytte dem ind i arsenalet og klikke p\u00E5 "Producer v\u00E5ben" ikonet, der findes under "Saml ressourcer" ikonet (eller tryk W).
chieftain_built=Bem\u00E6rk at mens h\u00F8vdingen tr\u00E6nes, vil barakkerne ikke generere nye enheder. Du kan afbryde tr\u00E6ningen af h\u00F8vdingen ved at klikke p\u00E5 "Tr\u00E6n H\u00F8vding" ikonet igen (eller trykke C). Hvis du klikker igen, vil tr\u00E6ningen af en ny h\u00F8vding starte helt forfra.
empty_tower=Hvis du har brug for krigeren andetsteds, eller t\u00E5rnet er ved at brase sammen, kan du fjerne ham fra t\u00E5rnet. Fjern din kriger ved at v\u00E6lge t\u00E5rnet og klikke p\u00E5 "Exit" ikonet (eller trykke X).
from_map_mode=P\u00E5 oversigtskortet er dine enheder og bygninger lyst op med din spillerfarve. Klik et sted p\u00E5 kortet for at hoppe til det punkt eller tryk mellemrum eller 5 p\u00E5 det numeriske tastatur for at vende tilbage til det tidligere punkt.
harvest_menu=Dit arsenals lager af ressourcer, enheder og v\u00E5ben er vist i toppen. Klik p\u00E5 "Saml ressourcer" ikonet (eller tryk G) for at samle ressourcer til at bygge v\u00E5ben med.
magic=H\u00F8vdingen har to specialangreb, som begge tager tid at oplade, f\u00F8r de kan bruges. V\u00E6lg din h\u00F8vding og pr\u00F8v begge angreb ved at klikke p\u00E5 deres ikoner (eller trykke S eller C), n\u00E5r de bliver tilg\u00E6ngelige.
map_mode=Tryk mellemrum eller 5 p\u00E5 det numeriske tastatur for at komme til oversigtskortet.
move_unit=Flyt valgte enheder ved at bruge "G\u00E5" ikonet (M) eller h\u00F8jreklikke p\u00E5 \u00F8en (Ctrl-klik p\u00E5 Mac OS X).
pitch=Kig op og ned ved at bruge 2 og 8 p\u00E5 det numeriske tastatur eller Home og End.
placing=Du starter spillet med en lille gruppe arbejdere, den mest basale enhed. Arbejdere kan bygge og reparere bygninger samt samle ressourcer. V\u00E6lg dine arbejdere og klik p\u00E5 "Barakker" ikonet (eller tryk Q).
quarters=De gr\u00F8nne firkanter indikerer mulige bygningsplaceringer. Hold musen over en af disse og tryk for at bygge bygningen.
rally_point=Du kan angive hvor dine enheder skal samles, n\u00E5r de forlader barakkerne ved at s\u00E6tte et samlingspunkt. V\u00E6lg dine barakker, klik p\u00E5 "Samlingspunkt" ikonet (eller tryk R) og klik et sted p\u00E5 \u00F8en for at placere samlingspunktet.
repair=Da du blev angrebet, blev dit t\u00E5rn beskadiget. Du kan se status af en bygning ved at holde musen over den. Reparer en bygning ved at v\u00E6lge nogle arbejdere, klikke p\u00E5 "Reparer" ikonet (eller trykke G) og klikke p\u00E5 bygningen. Reparer nu dit t\u00E5rn.
rotate=Roter ved at bruge 4 og 6 p\u00E5 det numeriske tastatur eller Insert og Delete.
scroll=Bev\u00E6g dig rundt p\u00E5 kortet ved at flytte musen til kanten af sk\u00E6rmen eller ved at bruge piletasterne.
select_armory=V\u00E6lg dine arbejdere og klik p\u00E5 "Arsenal" ikonet (eller tryk R) for at bygge et arsenal. N\u00E5r bygningen er f\u00E6rdig vil dine arbejdere automatisk g\u00E5 ind i den. Klik p\u00E5 bygningen for at v\u00E6lge den.
select_quarters=Hold musen over byggepladsen for at f\u00F8lge fremskridtet. Brug + og - p\u00E5 det numeriske tastatur til at justere hastigheden. V\u00E6lg bygningen n\u00E5r den er f\u00E6rdig. En lys gr\u00F8n ring vil indikere, at den er valgt.
select_unit=V\u00E6lg en enhed ved at klikke p\u00E5 den. V\u00E6lg flere enheder ved at holde Shift nede mens du klikker p\u00E5 flere enheder eller ved at tr\u00E6kke en boks omkring de \u00F8nskede enheder. Du kan ogs\u00E5 v\u00E6lge alle enheder af samme type indenfor sk\u00E6rmen, ved at dobbeltklikke p\u00E5 en af dem. Valgte enheder er markeret med en lys gr\u00F8n ring.
supply=For hver ressourcetype kan du klikke p\u00E5 det lille "+" ikon for at udsende arbejdere til at samle den type ressource. Arbejderne vil forts\u00E6tte med at g\u00F8re det, indtil du v\u00E6lger dem og giver dem en anden ordre. Pr\u00F8v at samle {0} tr\u00E6 og {1} sten.
tutorial_over=Byg barakker og et arsenal, saml ressourcer, producer nogle v\u00E5ben og udsend en h\u00E6r. V\u00E6lg din h\u00E6r, klik p\u00E5 "Angrib" ikonet (eller tryk A), bev\u00E6g dig til den anden side af \u00F8en og klik p\u00E5 eller n\u00E6r en fjende. Udslet alle fjendtlige enheder og bygninger!
unit_count=Barakkernes prim\u00E6re opgave er at producere flere arbejdere. Jo flere arbejdere du har i bygningen, desto hurtigere vil den producere nye arbejdere. V\u00E6lg bygningen og klik p\u00E5 det lille "+" ikon for at sende arbejdere ud af barakkerne. Pr\u00F8v at sende mindst {0} arbejdere ud af barakkerne.
unit_in_tower=En kriger i et t\u00E5rn f\u00E5r en angrebsbonus og kan ikke blive dr\u00E6bt, medmindre t\u00E5rnet bliver smadret. Du kan placere en kriger i et t\u00E5rn ved at h\u00F8jreklikke p\u00E5 t\u00E5rnet, mens du har valgt en kriger. Placer din kriger i t\u00E5rnet.
units_in_quarters=V\u00E6lg dine arbejdere og flyt dem ind i barakkerne, enten ved at klikke p\u00E5 "G\u00E5" ikonet (eller trykke M) og s\u00E5 klikke p\u00E5 barakkerne eller simpelthen ved at h\u00F8jreklikke p\u00E5 barakkerne (Ctrl-klik p\u00E5 Mac OS X).
weapon=For hver tilg\u00E6ngelig v\u00E5bentype bruges de sm\u00E5 "+" og "-" ikoner til at angive hvor mange v\u00E5ben dine arbejdere skal producere (hold musen over v\u00E5benikonerne for at se hvilke ressourcer de kr\u00E6ver). Jo flere arbejdere du har i bygningen, desto hurtigere vil de producere v\u00E5bnene. Pr\u00F8v at producere {0} stenv\u00E5ben.
zoom=Zoom ind og ud ved at rulle p\u00E5 musehjulet eller ved at trykke Page Up og Page Down. Du kan ogs\u00E5 holde Z nede og flytte musen op og ned.
select_tower=V\u00E6lg dine arbejdere, klik "T\u00E5rn" (eller tryk T) og find et passende sted at bygge dit t\u00E5rn. V\u00E6lg t\u00E5rnet n\u00E5r det er bygget.
fpc=N\u00E5r du holder F eller den midterste museknap nede, kan du \u00E6ndre synsretningen ved at flytte med musen.
