army_menu=Ritorna al menu principale dell''armeria cliccando sull''icona Indietro (o prendo Esc). Per equipaggiare un soldato con le armi appena prodotte, clicca sull''icona Crea esercito (o premi A).
army=Per ogni tipo di arma, puoi creare il corrispondente tipo di guerriero. Usa le icone + e -  per impostare il numero di guerrieri desiderati. Prova a creare un''armata di {0} Guerrieri di roccia.
attack_tower=La tua torre \u00E8 attaccata da un piccolo gruppo di guerrieri Vichinghi. Un guerriero su una torre attacca automaticamente tutti i nemici sotto tiro, quindi divertiti a vedere i Vichinghi venire macellati.
building_chieftain=Costruisci un casone e muovi i tuoi peoni all''interno. Pi\u00F9 unit\u00E0 hai nel casone, il pi\u00F9 velocemente addestreranno un capo trib\u00F9. Seleziona il casone e clicca sull''icona Capo Trib\u00F9 (o premi C).
build_menu=Ritorna all''armeria cliccando sull''icona Indietro in basso (o premi Esc). Per produrre alcune armi scegli alcuni peoni, muovili all''interno dell''armeria e clicca sull''icona Produci Armi situata dopo l''icona Raccogli risorse (o premi W).
chieftain_built=Nota che mentre il capo trib\u00F9 \u00E8 in fase di addestramento, il casone non genera nuove unit\u00E0. Puoi annullare l''addestramento del capo trib\u00F9 cliccando di nuovo sull''icona Capo Trib\u00F9 (o premendo C). Cliccando di nuovo verr\u00E0 ricominciato l''addestramento dall''inizio.
empty_tower=Se hai bisogno di un guerriero altrove o la torre sta per essere distrutta, puoi rimuoverlo dalla torre. Rimuovilo selezionando la torre e cliccando sull''icona Esci (o premendo X).
from_map_mode=Nella modalit\u00E0 mappa, le tue unit\u00E0 e i tuoi edifici sono evidenziati con il tuo colore. Clicca in un punto della mappa per zumare o premi spazio o 5 sul tastierino numerico per uscire dalla modalit\u00E0 mappa.
harvest_menu=Il tuo inventario di risorse, unit\u00E0 e armi \u00E8 mostrato in alto. Per raccogliere alcune risorse per costruire armi, clicca sul''icona Raccogli Risorse (o premi G).
magic=Il capo trib\u00F9 ha due attacchi speciali, entrambi richiedono un po'' di tempo per caricarsi prima di poter essere usati. Seleziona il tuo capo e prova entrambi gli attacchi in sequenza cliccando sulle rispettive icone (o premendo S o C) quando divengono disponibili.
map_mode=Premi spazio o 5 sul tastierino numerico per entrare nel modo mappa.
move_unit=Muovi le unit\u00E0 selezionate usando l''icona Muovi (M) o con il bottone destro sulla mappa (Ctrl-click su Mac OS X).
pitch=Guarda in alto e in basso usando 2 e 8 sul tastierino numerico o Home e End.
placing=Cominci il gioco con un piccolo gruppo di peoni, le unit\u00E0 di base. I peoni possono costruire e riparare edifici e raccogliere risorse. Seleziona i tuoi peoni e clicca sull''icona Casone (o premi Q).
quarters=I quadrati verdi indicano possibili luoghi di costruzione. Trascina il mouse su uno di questi e clicca per costruire l''edificio.
rally_point=Puoi decidere dove i tuoi peoni devono assemblarsi quando lasciano il casone impostando un luogo di raduno. Seleziona il casone, clicca sull''icona luogo di raduno (o premi R) e clicca in un punto dell''isola per posizionare il luogo di raduno.
repair=Quando sei attaccato, le tue torri verranno danneggiate. Puoi vedere lo stato di un edificio passandoci sopra il mouse. Ripara un edificio selezionando alcuni peoni e cliccando sull''icona Ripara (o premendo G) e cliccando sull''edificio. Adesso ripara la tua torre.
rotate=Ruota la vista usando 4 e 6 del tastierino numerico o Ins e Canc.
scroll=Spostati all''interno della mappa muovendo il mouse ai lati dello schermo o usando le frecce.
select_armory=Seleziona i tuoi peoni e clicca sull''icona dell''Armeria (o premi R) per costruire un''armeria. Quando l''edificio \u00E8 completo, i tuoi peoni vi andranno all''interno automaticamente. Clicca sull''edificio per selezionarlo.
select_quarters=Muovi il mouse sugli edifici in costruzione per monitorarne il progresso. Usa + e - sul tastierino numerico per cambiare la velocit\u00E0 del gioco. Quando l''edificio \u00E8 completato, selezionalo cliccandoci sopra. Un cerchio verde ti indicher\u00E0 che lo hai selezionato.
select_unit=Seleziona una unit\u00E0 cliccandoci sopra. Seleziona pi\u00F9 unit\u00E0 tenendo premuto il tasto shift mentre clicchi su pi\u00F9 unit\u00E0 o tracciando un quadrato di selezione sulle unit\u00E0 da selezionare. Puoi anche selezionare tutte le unit\u00E0 di uno stesso tipo con un doppio click su una di esse. Le unit\u00E0 selezionate sono evidenziate da un cerchio verde.
supply=Per ogni tipo di risorsa, puoi cliccare sull''icona + per assegnare dei peoni alla sua raccolta. Il peone continuer\u00E0 il suo lavoro finch\u00E8 lo selezionerai per dagli ordini differenti. Prova a raccogliere {0} risorse di legno e {1} di roccia.
tutorial_over=Costruisci un casone e un''armeria, raccogli risorse, produci armi e crea un''armata. Seleziona la tua armata, clicca su Attacca (o premi A), posizionati dall''altra parte dell''isola e clicca vicino ai nemici e agli edifici. Annienta tutte le unit\u00E0 nemiche e i loro edifici!
unit_count=La funzione principale del casone \u00E8 di produrre peoni. Pi\u00F9 peoni hai all''interno dell''edificio, il pi\u00F9 velocemente produrranno nuovi peoni. Scegli l''edificio e clicca sull''icona + per muovere i peoni fuori dal casone. Prova a far uscire almeno {0} peoni fuori dal casone.
unit_in_tower=Un guerriero in una torre non pu\u00F2 essere ucciso finch\u00E8 la torre non \u00E8 distrutta. Puoi mettere un guerriero su una torre cliccando con il bottone destro sulla torre dopo aver selezionato un guerriero. Metti il tuo guerriero nella torre.
units_in_quarters=Seleziona i tuoi peoni e spostali dentro al casone cliccando sull''icona Muovi (o premendo M) e cliccando sul casone o semplicemente con un click destro sul casone (Ctrl+click su Mac OS X).
weapon=Per ogni tipo di arma, usa + e - per decidere quante armi vuoi che i tuoi peoni producano (muovi il mouse sopra le icone per vedere quante risorse sono necessarie). Pi\u00F9 peoni hai nell''edificio, il pi\u00F9 velocemente produrranno armi. Prova a produrre {0} armi di roccia.
zoom=Zuma muovendo la rotellina del mouse o usando Pag Su o Pag Gi\u00F9. Alternativamente puoi tenere premuto Z e muovere il mouse su e gi\u00F9.
select_tower=Seleziona i tuoi peoni, clicca Torre (o premi T) e trova un luogo per costruire la tua torre. Quando \u00E8 costruita selezionala.
fpc=Tenendo premuto F o il bottone centrale del mouse puoi cambiare la direzione della camera muovendo il mouse..
