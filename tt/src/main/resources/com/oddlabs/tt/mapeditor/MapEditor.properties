hint_height=Left: raise ground  |  Right: lower ground
hint_flatten=Left: fill up to the height where the stroke began  |  Right: cut down to it
hint_smooth=Left: smooth  |  Right: sharpen
hint_random=Left: heap up random ground  |  Right: dig random ground away
hint_ramp=Drag from the ramp's start to its end.  Left: build the ramp up  |  Right: carve it down
hint_path=Click out the path, Enter or right click lays it, intensity sets its side slopes  |  Backspace: last point
hint_roughness=Left: roughen with bumps of every size  |  Right: calm small bumps, keeping the lie of the land
hint_isthmus=Click: islet at sea level, drag: land bridge (intensity: crown)  |  Right: strait (intensity: depth)
hint_river=Click out the course, Enter or right click digs it, intensity sets depth  |  Backspace: last point
hint_mountain=Click out the ridge, Enter or right click raises it, intensity sets height  |  Backspace: last point
hint_cliffs=Left: lift the ground in cells with cliffs between, like the generator  |  Right: sink it in cells
hint_erode=Left: erode like the generator, into level shelves and cliffs  |  Right: weather cliffs into slopes
hint_warp=Left: twist the ground along a swirling flow so coasts wander  |  Right: twist it the other way
hint_twist=Left: turn the ground under the brush anticlockwise as one piece  |  Right: turn it clockwise
hint_swirl=Left: swirl the ground anticlockwise into a spiral, fastest in the middle  |  Right: swirl it clockwise
hint_stretch=Left: drag the ground like putty, skewing it upwards  |  Right: skew it downwards (intensity: how much holds)
hint_beach=Left: ease the shore into beaches and shallows, like the generator  |  Right: make a cliff coast
hint_copy=Drag over an area to copy its ground, trees, rock and iron
hint_paste=Left: paste onto the ground, Shift+Left: at the heights copied  |  R: turn  |  M: mirror  |  Right: drop it
copied=Copied {0} by {1} m. Left click to paste it.
