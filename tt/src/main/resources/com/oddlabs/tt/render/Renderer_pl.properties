checksum_error_message=W najnowszej grze wyst\u0105pi\u0142 b\u0142\u0105d sumy kontrolnej.\n\nKlikni\u0119cie OK spowoduje zamkni\u0119cie gry i wy\u015Bwietlenie monitu o przes\u0142anie raportu o b\u0142\u0119dzie przy nast\u0119pnym uruchomieniu gry.\nKlikni\u0119cie Anuluj spowoduje kontynuacj\u0119 sesji gry i nie wy\u015Ble \u200B\u200Braportu o b\u0142\u0119dzie.\nKlikni\u0119cie OK jest zdecydowanie zalecane, poniewa\u017C raporty o b\u0142\u0119dach pomog\u0105 Oddlabs szybko zlokalizowa\u0107 i rozwi\u0105za\u0107 problem.
